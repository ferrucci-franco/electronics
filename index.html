    body{margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji","Segoe UI Emoji"; color:var(--fg); background:var(--bg); line-height:1.55}

    .title p{margin:.15rem 0 0; color:var(--muted); font-size:14px}

    .controls{display:flex; gap:10px; align-items:center; flex-shrink:0}
    .btn{border:1px solid var(--border); background:var(--card); color:var(--fg); padding:10px 14px; border-radius:12px; cursor:pointer; font-weight:600; box-shadow:var(--shadow)}

    .segmented{display:flex; background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:var(--shadow)}
    .segmented button{border:0; padding:8px 12px; background:transparent; color:var(--muted); font-weight:600; cursor:pointer}
    .segmented button.active{background:var(--bg); color:var(--fg)}

    .hero{margin-top:18px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-xl); box-shadow:var(--shadow); padding:22px clamp(16px,3vw,28px)}
    .hero h2{margin:.2rem 0 .6rem; font-size:clamp(20px,2.6vw,28px)}
    .hero p{margin:.25rem 0; color:var(--muted)}
    .hero p.lead{color:var(--fg); font-size:clamp(15px,1.6vw,17px)}

    .nav{display:flex; gap:8px; flex-wrap:wrap; margin-top:22px; padding:10px 0}
    @media (min-width:700px){ .nav{position:sticky; top:0; z-index:5; background:var(--bg)} }
    .nav button{border:1px solid var(--border); background:var(--card); color:var(--muted); padding:7px 14px; border-radius:999px; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit}
    .nav button:hover{color:var(--fg)}
    .nav button.active{background:var(--accent); border-color:var(--accent); color:#fff}
    .nav button .n{opacity:.7; font-weight:500; margin-left:4px}

    .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:16px}
    .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px}
    .card h3{margin:0; font-size:18px}
    .card p{margin:0; color:var(--muted); font-size:14px}
    .chipbar{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
    .chip{font-size:12px; border:1px solid var(--border); background:transparent; color:var(--muted); padding:2px 8px; border-radius:999px}

    .sec{margin-top:28px; scroll-margin-top:64px}
    .sec[hidden]{display:none}
    .section-title{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-bottom:8px; border-bottom:2px solid var(--border)}
    .section-title h2{margin:0; font-size:clamp(19px,2.2vw,24px)}
    .section-title .muted{white-space:nowrap; font-size:14px}
    .sec > p{margin:8px 0 0; color:var(--muted); font-size:14px}
    .muted{color:var(--muted)}

    footer{margin-top:30px; color:var(--muted); font-size:13px}
    .mono{font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}

    const SECTIONS = [

                 fr: "Réponses indicielles, boucle ouverte vs fermée, réglage PID, lieu des racines.",

                 fr: "Circuits DC, convertisseurs de puissance, codeurs.",
                 es: "Circuitos DC, convertidores de potencia, encoders." } },
      { id: "lab",
        title: { en: "Measurements & lab", fr: "Mesures & laboratoire", es: "Mediciones y laboratorio" },
        blurb: { en: "Tools that work with real data: microphone, sensors, simulation result files.",
                 fr: "Outils qui travaillent avec des données réelles : microphone, capteurs, fichiers de résultats de simulation.",
                 es: "Herramientas que trabajan con datos reales: micrófono, sensores, archivos de resultados de simulación." } },
      { id: "other",
        title: { en: "Other", fr: "Autres", es: "Otros" },
        blurb: { en: "", fr: "", es: "" } },
    ];

    // --------- Translations ---------
    const TXT = {
      en: {
        name: "Franco Ferrucci",
        tag: "Signals & systems • Control • Electronics",
        hello: "Interactive demos for teaching",
        about: "Small web apps to explore signals & systems, control and electronics. Everything runs in the browser, nothing to install.",
        about2: "I built them for my courses at the University of French Polynesia (Tahiti). Pick a section below, or browse them all.",
        all: "All",
        count: n=>`${n} page${n===1?"":"s"}`,
        footName: "Franco Ferrucci"
      },
      fr: {
        name: "Franco Ferrucci",
        tag: "Signaux & systèmes • Automatique • Électronique",
        hello: "Démos interactives pour l'enseignement",
        about: "Petites applications web pour explorer les signaux & systèmes, l'automatique et l'électronique. Tout tourne dans le navigateur, rien à installer.",
        about2: "Je les ai conçues pour mes cours à l'Université de la Polynésie française (Tahiti). Choisissez une section ci-dessous, ou parcourez tout.",
        all: "Tout",
        count: n=>`${n} page${n>1?"s":""}`,
        footName: "Franco Ferrucci"
      },
      es: {
        name: "Franco Ferrucci",
        tag: "Señales y sistemas • Control • Electrónica",
        hello: "Demos interactivas para la enseñanza",
        about: "Pequeñas aplicaciones web para explorar señales y sistemas, control y electrónica. Todo corre en el navegador, sin instalar nada.",
        about2: "Las hice para mis cursos en la Universidad de la Polinesia Francesa (Tahití). Elegí una sección abajo, o recorrelas todas.",
        all: "Todas",
        count: n=>`${n} página${n===1?"":"s"}`,
        footName: "Franco Ferrucci"
      }
    };

    // --------- Language logic ---------
    const $ = (q)=>document.querySelector(q);
    const sectionsEl = $('#sections');
    const navEl = $('#nav');
    const btns = [$('#btn-en'), $('#btn-fr'), $('#btn-es')];
    let currentLang = 'en';

    function preferredLang(){
      const saved = localStorage.getItem('lang');
      if(saved) return saved;
      const nav = navigator.language.toLowerCase();
      if(nav.startsWith('fr')) return 'fr';
      if(nav.startsWith('es')) return 'es';
      return 'en';
    }

    function cardHTML(p, lang){
      return `
        <h3>${(p.titles && p.titles[lang]) || p.titles?.en || p.url}</h3>
        <p>${(p.desc && p.desc[lang]) || p.desc?.en || ''}</p>
        <div class="chipbar">${(p.tags||[]).map(tag=>`<span class="chip">${tag}</span>`).join('')}</div>
      `;
    }

    // Which section is selected: "all" or a SECTIONS id. Kept in the URL hash so links are shareable.
    function currentFilter(){
      const h = location.hash.replace('#','');
      return SECTIONS.some(s=>s.id===h) ? h : 'all';
    }

    function renderNav(lang){
      const t = TXT[lang] || TXT.en;
      const f = currentFilter();
      navEl.innerHTML = '';
      const items = [{id:'all', label:t.all, n:PAGES.length}]
        .concat(SECTIONS.map(s=>({id:s.id, label:s.title[lang]||s.title.en, n:PAGES.filter(p=>p.cat===s.id).length})))
        .filter(it=>it.n>0);
      items.forEach(it=>{
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.id = it.id;
        b.classList.toggle('active', it.id===f);
        b.setAttribute('aria-pressed', it.id===f);
        b.innerHTML = `${it.label}<span class="n">${it.n}</span>`;
        b.addEventListener('click', ()=>{
          if(it.id==='all') history.replaceState(null,'',location.pathname+location.search);
          else history.replaceState(null,'','#'+it.id);
          applyFilter();
          window.scrollTo({top:0, behavior:'smooth'});
        });
        navEl.appendChild(b);
      });
    }

    function renderSections(lang){
      const t = TXT[lang] || TXT.en;
      sectionsEl.innerHTML = '';
      SECTIONS.forEach(s=>{
        const pages = PAGES.filter(p=>p.cat===s.id);
        if(!pages.length) return;
        const sec = document.createElement('section');
        sec.className = 'sec';
        sec.id = 'sec-'+s.id;
        sec.setAttribute('aria-labelledby', 'h-'+s.id);
        const blurb = (s.blurb && (s.blurb[lang]||s.blurb.en)) || '';
        sec.innerHTML = `
          <div class="section-title">
            <h2 id="h-${s.id}">${s.title[lang]||s.title.en}</h2>
            <span class="muted">${t.count(pages.length)}</span>
          </div>
          ${blurb ? `<p>${blurb}</p>` : ''}
          <div class="grid"></div>
        `;
        const grid = sec.querySelector('.grid');
        pages.forEach(p=>{
          const a = document.createElement('a');
          a.className = 'card';
          a.href = p.url;
          a.innerHTML = cardHTML(p, lang);
          grid.appendChild(a);
        });
        sectionsEl.appendChild(sec);
      });
      // Pages with an unknown category are still listed, so nothing gets lost silently.
      const orphans = PAGES.filter(p=>!SECTIONS.some(s=>s.id===p.cat));
      if(orphans.length) console.warn('Pages without a valid cat:', orphans.map(p=>p.url));
    }

    function applyFilter(){
      const f = currentFilter();
      document.querySelectorAll('.sec').forEach(sec=>{
        sec.hidden = (f!=='all' && sec.id!=='sec-'+f);
      });
      navEl.querySelectorAll('button').forEach(b=>{
        const on = b.dataset.id===f;
        b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
      });
    }

    function setLang(lang){
      const t = TXT[lang] || TXT.en;
      currentLang = lang;
      $('#name').textContent = t.name;
      $('#tag').textContent = t.tag;
      $('#intro-title').textContent = t.hello;
      $('#intro-body').textContent = t.about;
      $('#intro-more').textContent = t.about2;
      $('#foot-name').textContent = t.footName;
      document.documentElement.lang = lang;

      // Buttons UI
      btns.forEach(b=>{
        const active = b.dataset.lang === lang; b.classList.toggle('active', active); b.setAttribute('aria-selected', active);
      });

      renderNav(lang);
      renderSections(lang);
      applyFilter();

      localStorage.setItem('lang', lang);
    }

    btns.forEach(b=> b.addEventListener('click', ()=> setLang(b.dataset.lang)));
    window.addEventListener('hashchange', applyFilter);

    // --------- Theme toggle ---------
    const themeBtn = document.getElementById('themeBtn');
    function applyTheme(mode){
      document.documentElement.classList.remove('light','dark');
      if(mode === 'light') document.documentElement.classList.add('light');
      if(mode === 'dark') document.documentElement.classList.add('dark');
      localStorage.setItem('theme', mode);
    }
    function initTheme(){
      const saved = localStorage.getItem('theme');
      if(saved){ applyTheme(saved); }
    }
    themeBtn.addEventListener('click', ()=>{
      const html = document.documentElement;
      applyTheme(html.classList.contains('dark') ? 'light' : 'dark');
    });

    // --------- Init ---------
    document.getElementById('year').textContent = new Date().getFullYear();
    setLang(preferredLang());
    initTheme();
  </script>
