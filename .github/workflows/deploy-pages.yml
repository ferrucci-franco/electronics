name: Deploy electronics site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : commit du dernier changement de chaque app

      - name: Assemble Pages site
        run: |
          mkdir -p site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.temp/' \
            --exclude='site/' \
            ./ ./site/
          touch site/.nojekyll

      - name: Offline copy of dsp-with-arduino-and-esp32 (zip named after its last commit)
        run: |
          APP=dsp-with-arduino-and-esp32
          SHA=$(git log -1 --format=%h --abbrev=7 -- "$APP")
          sed -i "s/const BUILD_COMMIT = '';/const BUILD_COMMIT = '$SHA';/" "site/$APP/index.html"
          grep -q "const BUILD_COMMIT = '$SHA';" "site/$APP/index.html"
          (cd site && zip -qr "$APP/${APP}_$SHA.zip" "$APP" -x '*.zip')
          ls -l "site/$APP/${APP}_$SHA.zip"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
