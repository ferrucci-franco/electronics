<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  :root{
    --bg:#ffffff; --fg:#212121; --panel:#fafafa; --panel-border:#cccccc;
    --bar-bg:#f5f5f5; --bg-tertiary:#e0e0e0; --hover-bg:#e8e8e8; --text-secondary:#757575;
    --primary:#2196F3;
    --btn:#ffffff; --accent:#2196F3; --plot-bg:#ffffff; --plot-paper:#ffffff; --grid:#e8e8e8; --plot-font:#333333;
    --modal-overlay: rgba(0,0,0,0.35);
    --modal-bg: #f0f0f0;
    --modal-fg: #111111;
    --modal-border: #bdbdbd;
  }
  .dark-mode{
    --bg:#1e1e1e; --fg:#e0e0e0; --panel:#252525; --panel-border:#444444;
    --bar-bg:#2d2d2d; --bg-tertiary:#3d3d3d; --hover-bg:#353535; --text-secondary:#a0a0a0;
    --primary:#2196F3;
    --btn:#1e1e1e; --accent:#2196F3; --plot-bg:#2d2d2d; --plot-paper:#2d2d2d; --grid:#3d3d3d; --plot-font:#d0d0d0;
    --modal-overlay: rgba(0,0,0,0.6);
    --modal-bg: #1b1d22;
    --modal-fg: #e5e7eb;
    --modal-border: #2f343b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:Calibri,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--fg);
    height:100vh; overflow:hidden;
    display:grid; grid-template-columns:320px 1fr; grid-template-rows:auto 1fr;
    grid-template-areas:"header header" "sidebar main";
  }
  body.sidebar-collapsed{ grid-template-columns:0 1fr; }
  #sideWrap{ min-width:0 }

  /* Sidebar credits */
  .sidebar-credits{
    text-align:center;
    padding: 6px 8px 14px;
    color: var(--fg);
    opacity: .75;
    font-size: .9rem;
  }
  .sidebar-credits small{ letter-spacing:.02em; }

  header{
    grid-area:header; background:var(--bar-bg); border-bottom:1px solid var(--panel-border);
    padding:8px 16px; display:flex; gap:16px; align-items:center; justify-content:space-between;
  }
  .title{margin:0; font-weight:700; font-size:1.25rem; white-space:nowrap}
  #formula{flex:1 1 auto; text-align:center; min-width:0; overflow:hidden; font-size:1.4rem}
  .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:nowrap}
  button,select,label{font-size:0.95rem}
  button{
    background:var(--btn); color:var(--fg); border:1px solid var(--panel-border);
    border-radius:8px; padding:6px 12px; cursor:pointer; font-family:inherit; transition:all .2s; white-space:nowrap;
  }
  button:hover{background:var(--hover-bg); border-color:var(--panel-border)}
  .language-selector{display:flex; gap:4px; background:var(--bg-tertiary); padding:4px; border-radius:8px; margin-right:6px}
  .lang-btn{padding:4px 12px; border:none; background:transparent; font-size:.85rem; border-radius:6px}
  .lang-btn:hover{background:var(--hover-bg)}
  .lang-btn.active,.lang-btn.active:hover{background:var(--primary); color:#fff; box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .top-btn{height:36px}
  .icon-only{width:40px; padding:0; font-size:1.15rem; line-height:1}
  .top-btn:hover{transform:translateY(-1px); box-shadow:0 2px 4px rgba(0,0,0,.1)}

  #sideWrap{grid-area:sidebar; position:relative; width:320px; z-index:5; min-height:0}
  body.sidebar-collapsed #sideWrap{ width:0; }
  #sidebar{
    background:var(--panel); border-right:1px solid var(--panel-border);
    display:flex; flex-direction:column; gap:10px; padding:12px; overflow-x:hidden; overflow-y:auto; width:320px; height:100%;
    scrollbar-width:auto;
    scrollbar-color:color-mix(in srgb, var(--text-secondary) 45%, transparent) var(--panel);
  }
  #sidebar::-webkit-scrollbar{width:18px}
  #sidebar::-webkit-scrollbar-track{background:var(--panel)}
  #sidebar::-webkit-scrollbar-thumb{
    background:color-mix(in srgb, var(--text-secondary) 38%, transparent);
    border:3px solid var(--panel); border-radius:999px; background-clip:content-box;
  }
  #sidebar:hover::-webkit-scrollbar-thumb{
    background:color-mix(in srgb, var(--primary) 58%, var(--text-secondary));
    border:3px solid var(--panel); background-clip:content-box;
  }
  body.sidebar-collapsed #sidebar{ display:none; }

  /* edge pill (as in timeseries-explorer) */
  .edge-toggle{
    position:absolute; top:50%; left:100%; transform:translate(-50%,-50%);
    width:14px; height:46px; padding:0; display:flex; align-items:center; justify-content:center;
    border:1px solid color-mix(in srgb, var(--primary) 40%, var(--panel-border)); border-radius:999px;
    background:color-mix(in srgb, var(--primary) 8%, var(--bg));
    color:color-mix(in srgb, var(--primary) 45%, var(--text-secondary));
    box-shadow:0 1px 3px rgba(0,0,0,.18); z-index:20;
    transition:color .15s, border-color .15s, background-color .15s;
  }
  .edge-toggle:hover,.edge-toggle:focus-visible{
    color:var(--primary); border-color:var(--primary);
    background:color-mix(in srgb, var(--primary) 16%, var(--bg));
  }
  .edge-toggle svg{width:8px; height:16px}
  body.sidebar-collapsed .edge-toggle{left:0; transform:translate(0,-50%)}
  body.sidebar-collapsed .edge-toggle svg{transform:rotate(180deg)}

  .control-card{background:var(--bg); border:1px solid var(--panel-border); border-radius:8px; padding:12px}
  .row{display:grid; gap:8px}
  input[type="range"]{accent-color:var(--primary)}
  .row label{display:flex; justify-content:space-between; align-items:center; font-size:0.9rem}
  .hint{font-size:0.86rem; opacity:.9; margin-top:2px}
  input[type="range"]{width:100%}
  .checks{display:grid; gap:6px; margin-top:8px}
  .checks label{display:flex; align-items:center; gap:8px; font-size:0.95rem}

  #main{grid-area:main; padding:8px; display:flex; flex-direction:column; overflow:hidden}
  #plots{flex:1; display:grid; gap:0; column-gap:0; row-gap:8px; grid-template-columns:var(--w3d,1.2fr) 10px minmax(0,1fr); grid-template-rows:1fr 1fr;
         grid-template-areas:"plot3d split plotRe" "plot3d split plotIm"; min-height:480px; min-width:0}
  #plot3d,#plotRe,#plotIm{min-width:0}
  #plotRe,#plotIm{position:relative}
  .hv{position:absolute; inset:0; pointer-events:none; overflow:hidden; display:none; z-index:5}
  .hv-line{position:absolute; width:0; border-left:1px dashed var(--text-secondary)}
  .hv-dot{position:absolute; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%; border:2px solid var(--bg); box-shadow:0 0 0 1px rgba(0,0,0,.35)}
  .hv-label{position:absolute; background:var(--bg); color:var(--fg); border:1px solid var(--panel-border); border-radius:6px; padding:4px 8px; font-size:.85rem; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .hv-t{opacity:.7; margin-bottom:2px}
  .hv-sw{display:inline-block; width:10px; height:3px; margin-right:6px; vertical-align:middle; border-radius:2px}
  #splitter{grid-area:split; cursor:col-resize; touch-action:none; position:relative}
  #splitter::after{content:""; position:absolute; top:0; bottom:0; left:50%; width:3px; margin-left:-1.5px; background:color-mix(in srgb, var(--primary) 35%, transparent); border-radius:3px; transition:background .2s}
  #splitter::before{content:""; position:absolute; top:50%; left:50%; width:8px; height:44px; margin:-22px 0 0 -4px; border-radius:999px; z-index:1;
    background:var(--primary); opacity:.75; transition:opacity .2s, box-shadow .2s;
    background-image:radial-gradient(circle, #fff 1.2px, transparent 1.6px); background-size:8px 8px; background-position:center; }
  #splitter:hover::after,#splitter.dragging::after{background:var(--primary)}
  #splitter:hover::before,#splitter.dragging::before{opacity:1; box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent)}
  #plot3d{grid-area:plot3d; min-height:460px}
  #plotRe{grid-area:plotRe; min-height:220px}
  #plotIm{grid-area:plotIm; min-height:220px}

  .mini-toolbar{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:4px 6px}
  .flex-split{display:flex; gap:8px; align-items:center; justify-content:space-between}

  .modal{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center;
    background: var(--modal-overlay); z-index:50;
  }
  .modal .card{
      background: var(--modal-bg);
      color: var(--modal-fg);
      border: 1px solid var(--modal-border);
      border-radius: 12px;
      max-width: 800px;
      width: min(92vw, 800px);
      padding: 16px;
  }
  /* ensure MathJax inherits modal text color */
  .modal .card mjx-container[jax="CHTML"] { color: inherit; }

  .modal .close{margin-top:10px}

  @media (max-width:1100px){
    #plots{grid-template-columns:1fr; grid-template-rows:1fr 280px 280px; grid-template-areas:"plot3d" "plotRe" "plotIm"; row-gap:8px} #splitter{display:none}
  }
  @media (max-width:900px){
    body{ grid-template-columns:1fr; grid-template-rows:auto auto 1fr; grid-template-areas:"header" "sidebar" "main"; }
    body.sidebar-collapsed{ grid-template-rows:auto 1fr; }
    #sideWrap{width:auto; max-height:48vh}
    body.sidebar-collapsed #sideWrap{width:auto; max-height:0}
    #sidebar{width:auto; max-height:48vh; border-right:none; border-bottom:1px solid var(--panel-border)}
    .edge-toggle{top:100%; left:50%; width:46px; height:14px}
    .edge-toggle svg{transform:rotate(90deg)}
    body.sidebar-collapsed .edge-toggle{left:50%; top:0; transform:translate(-50%,0)}
    body.sidebar-collapsed .edge-toggle svg{transform:rotate(-90deg)}
    header{flex-wrap:wrap}
    #main{min-height:52vh}
  }
</style>

<body>
  <header>
    <h1 class="title" id="mainTitle">Complex exponentials and phasors</h1>
    <div id="formula">\( z(t)=A\,e^{j(\omega t+\phi)} = A\cos(\omega t+\phi) + j\,A\sin(\omega t+\phi) \)</div>
    <div class="toolbar">
      <div class="language-selector" role="group" aria-label="Language">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="fr">FR</button>
      </div>
      <button id="btnInfo" class="top-btn">ℹ️ Info</button>
      <button id="toggleTheme" class="top-btn icon-only" title="Dark Mode" aria-label="Dark Mode">🌙</button>
    </div>
  </header>

  <div id="sideWrap">
  <aside id="sidebar">
    <div class="control-card">
      <div class="flex-split">
        <strong id="paramsTitle">Parameters</strong>
        <button id="btnDefault">Default</button>
      </div>
    </div>

    <!-- φ: step 5°, no decimals -->
    <div class="control-card">
      <div class="row">
        <label><span id="labPhi">Phase φ (deg)</span> <span id="valPhi">-30</span></label>
        <input id="slPhi" type="range" min="-180" max="180" step="5" value="-30"/>
        <div class="hint" id="hintPhiRad">φ = -0.52 rad</div>
      </div>
    </div>

    <!-- A: integers 1,2,3 -->
    <div class="control-card">
      <div class="row">
        <label><span id="labA">Amplitude A</span> <span id="valA">1</span></label>
        <input id="slA" type="range" min="1" max="3" step="1" value="1"/>
        <div class="hint" id="hintA">Values: 1, 2, 3</div>
      </div>
    </div>

    <!-- ω: only 0.75, 1, 1.5 (slider snaps to those marks) -->
    <div class="control-card">
      <div class="row">
        <label><span id="labOmega">Omega ω (rad/s)</span> <span id="valOmega">1</span></label>
        <input id="slOmega" type="range" min="0.75" max="1.5" step="0.01" value="1" list="omegaMarks"/>
        <datalist id="omegaMarks">
          <option value="0.75"></option>
          <option value="1"></option>
          <option value="1.5"></option>
        </datalist>
        <!-- freq hint removed per request -->
      </div>
    </div>

    <!-- Periods: 1,2,3 -->
    <div class="control-card">
      <div class="row">
        <label><span id="labPeriods">Duration (periods)</span> <span id="valPeriods">1</span></label>
        <input id="slPeriods" type="range" min="1" max="3" step="1" value="1"/>
        <div class="hint" id="hintPeriods">1, 2, or 3 periods</div>
      </div>
    </div>

    <div class="control-card">
      <strong id="compareTitle">Compare with</strong>
      <div class="checks">
        <label><input id="cbDeriv" type="checkbox"/> <span id="labDeriv">Derivative dz/dt</span></label>
        <label><input id="cbInt"   type="checkbox"/> <span id="labInt">Integral ∫z(t)dt</span></label>
      </div>
    </div>

    <div class="control-card">
      <strong id="viewsTitle">Views</strong>
      <div class="mini-toolbar" style="margin-top:8px">
        <button id="viewReal">Real</button>
        <button id="viewImag">Imag</button>
        <button id="viewPlane">Complex plane</button>
        <button id="view3D">3D</button>
      </div>
    </div>
    
    <div class="sidebar-credits" aria-label="Credits">
        <small>© 2025 Franco FERRUCCI — HTML + JavaScript + Plotly</small>
    </div>
    
  </aside>
  <button id="toggleSidebar" class="edge-toggle" type="button" aria-expanded="true"><svg viewBox="0 0 8 16" aria-hidden="true" focusable="false"><path d="M6 2.5 1.8 8 6 13.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <main id="main">
    <div id="plots">
      <div id="plot3d"></div>
      <div id="splitter" role="separator" aria-orientation="vertical"></div>
      <div id="plotRe"></div>
      <div id="plotIm"></div>
    </div>
  </main>

  <div class="modal" id="modal">
    <div class="card">
      <div id="modalContent"></div>
      <button class="close" id="btnCloseModal">Close</button>
    </div>
  </div>

<script>
/* ================= constants ================= */
var RAD = Math.PI/180;
var COLORS = { z:"#2563eb", dz:"#ff8c00", int:"#7e57c2", phasorTip:"#1f2937" };
var AXIS_GRAY="gray", W3D=6, W2D=3, WPH=4, TIP_SIZE=5;
var N_SAMPLES=1000;

/* i18n text and info popup (same as before, trimmed here for brevity) */
var infoHTML = {
  en: `
  <p><strong>Differentiating and integrating complex exponential</strong></p>
  <p>The rules for differentiating and integrating \\(e^{z}\\) with complex \\(z=\\sigma+j\\omega\\) are the same as for real exponentials.</p>
  \\[
  \\frac{d}{dt}\\big(e^{z(t)}\\big)=z'(t)\\,e^{z(t)}
  \\]
  \\[
  \\frac{d}{dt}\\big(e^{(\\sigma+j\\omega)t}\\big)=(\\sigma+j\\omega)\\,e^{(\\sigma+j\\omega)t}=(\\sigma+j\\omega)e^{\\sigma t}e^{j\\omega t}
  \\]
  <hr/>
  <p><strong>Evolution of \\(\\dfrac{dz}{dt}\\)</strong></p>
  \\[
  \\frac{dz}{dt}=j\\omega A e^{j(\\omega t+\\varphi)}=
  \\underbrace{A e^{j\\varphi}}_{\\text{phasor of } z(t)}\\cdot \\omega e^{j90^\\circ}\\cdot e^{j\\omega t}
  =-\\omega A\\sin(\\omega t+\\varphi)+j\\omega A\\cos(\\omega t+\\varphi)
  \\]
  <p>The phasor of \\(\\frac{dz}{dt}\\) is the phasor of \\(z(t)\\) rotated by \\(+90^\\circ\\) and scaled by \\(\\omega\\).</p>
  <hr/>
  <p><strong>Evolution of \\(\\int z(t)\\,dt\\)</strong></p>
  \\[
  \\int z(t)\\,dt=\\frac{A}{j\\omega}e^{j(\\omega t+\\varphi)}=
  \\frac{1}{\\omega}e^{-j90^\\circ}\\cdot \\underbrace{A e^{j\\varphi}}_{\\text{phasor of } z(t)}\\cdot e^{j\\omega t}
  =\\frac{A}{\\omega}\\big[\\sin(\\omega t+\\varphi)-j\\cos(\\omega t+\\varphi)\\big]
  \\]
  <p>The phasor of the integral is the phasor of \\(z(t)\\) rotated by \\(-90^\\circ\\) and scaled by \\(1/\\omega\\).</p>
  `,

  es: `
  <p><strong>Diferenciación e integración de exponenciales complejas</strong></p>
  <p>Las reglas para derivar e integrar \\(e^{z}\\) con \\(z=\\sigma+j\\omega\\) son las mismas que para exponenciales reales.</p>
  \\[
  \\frac{d}{dt}\\big(e^{z(t)}\\big)=z'(t)\\,e^{z(t)}
  \\]
  \\[
  \\frac{d}{dt}\\big(e^{(\\sigma+j\\omega)t}\\big)=(\\sigma+j\\omega)\\,e^{(\\sigma+j\\omega)t}=(\\sigma+j\\omega)e^{\\sigma t}e^{j\\omega t}
  \\]
  <hr/>
  <p><strong>Evolución de \\(\\dfrac{dz}{dt}\\)</strong></p>
  \\[
  \\frac{dz}{dt}=j\\omega A e^{j(\\omega t+\\varphi)}=
  \\underbrace{A e^{j\\varphi}}_{\\text{fasor de } z(t)}\\cdot \\omega e^{j90^\\circ}\\cdot e^{j\\omega t}
  =-\\omega A\\sin(\\omega t+\\varphi)+j\\omega A\\cos(\\omega t+\\varphi)
  \\]
  <p>El fasor de \\(\\frac{dz}{dt}\\) es el de \\(z(t)\\) girado \\(+90^\\circ\\) y escalado por \\(\\omega\\).</p>
  <hr/>
  <p><strong>Evolución de \\(\\int z(t)\\,dt\\)</strong></p>
  \\[
  \\int z(t)\\,dt=\\frac{A}{j\\omega}e^{j(\\omega t+\\varphi)}=
  \\frac{1}{\\omega}e^{-j90^\\circ}\\cdot \\underbrace{A e^{j\\varphi}}_{\\text{fasor de } z(t)}\\cdot e^{j\\omega t}
  =\\frac{A}{\\omega}\\big[\\sin(\\omega t+\\varphi)-j\\cos(\\omega t+\\varphi)\\big]
  \\]
  <p>El fasor de la integral es el de \\(z(t)\\) girado \\(-90^\\circ\\) y escalado por \\(1/\\omega\\).</p>
  `,

  fr: `
  <p><strong>Dérivation et intégration d’une exponentielle complexe</strong></p>
  <p>Les règles pour dériver et intégrer \\(e^{z}\\) avec \\(z=\\sigma+j\\omega\\) sont les mêmes que pour les exponentielles réelles.</p>
  \\[
  \\frac{d}{dt}\\big(e^{z(t)}\\big)=z'(t)\\,e^{z(t)}
  \\]
  \\[
  \\frac{d}{dt}\\big(e^{(\\sigma+j\\omega)t}\\big)=(\\sigma+j\\omega)\\,e^{(\\sigma+j\\omega)t}=(\\sigma+j\\omega)e^{\\sigma t}e^{j\\omega t}
  \\]
  <hr/>
  <p><strong>Évolution de \\(\\dfrac{dz}{dt}\\)</strong></p>
  \\[
  \\frac{dz}{dt}=j\\omega A e^{j(\\omega t+\\varphi)}=
  \\underbrace{A e^{j\\varphi}}_{\\text{phaseur de } z(t)}\\cdot \\omega e^{j90^\\circ}\\cdot e^{j\\omega t}
  =-\\omega A\\sin(\\omega t+\\varphi)+j\\omega A\\cos(\\omega t+\\varphi)
  \\]
  <p>Le phaseur de \\(\\frac{dz}{dt}\\) est celui de \\(z(t)\\) tourné de \\(+90^\\circ\\) et multiplié par \\(\\omega\\).</p>
  <hr/>
  <p><strong>Évolution de \\(\\int z(t)\\,dt\\)</strong></p>
  \\[
  \\int z(t)\\,dt=\\frac{A}{j\\omega}e^{j(\\omega t+\\varphi)}=
  \\frac{1}{\\omega}e^{-j90^\\circ}\\cdot \\underbrace{A e^{j\\varphi}}_{\\text{phaseur de } z(t)}\\cdot e^{j\\omega t}
  =\\frac{A}{\\omega}\\big[\\sin(\\omega t+\\varphi)-j\\cos(\\omega t+\\varphi)\\big]
  \\]
  <p>Le phaseur de l’intégrale est celui de \\(z(t)\\) tourné de \\(-90^\\circ\\) et multiplié par \\(1/\\omega\\).</p>
  `
};
var tr = {

      viewReal:"Real",viewImag:"Imag.",viewPlane:"Plano complejo",view3D:"3D",
      axisTime:"Tiempo",axisReal:"Parte real",axisImag:"Parte imaginaria",axisX3d:"Tiempo",axisY3d:"Real",axisZ3d:"Imaginaria",
      reset:"Por defecto",info:"Info",close:"Cerrar",phasor:"fasor",hintA:"Valores: 1, 2, 3"},
  fr:{title:"Exponentielles complexes et phaseurs",params:"Paramètres",compare:"Comparer avec",views:"Vues",
      dark:"Mode sombre",light:"Mode clair",hide:"Masquer contrôles",show:"Afficher contrôles",

};
var lang="en";

/* ================= state ================= */
var A=1, omega=1, phi=-30*RAD, periods=1;
var showDeriv=false, showInt=false;
var darkMode=false, sidebarHidden=false;

var plot3D=null, plotRe=null, plotIm=null;
var initialized3D=false, initializedRe=false, initializedIm=false, syncAttached=false;
var lastSpan = 0, lastDat=null, hover3dIdx=-1, h3Pending=null, h3Raf=0;

/* time vector */
var N=N_SAMPLES;
var tNorm=new Array(N); for(var i=0;i<N;i++){ tNorm[i]=i/(N-1); }
function span(){ return periods*(2*Math.PI/omega); }
function timeVec(){ var s=span(), out=new Array(N); for(var i=0;i<N;i++){ out[i]=tNorm[i]*s; } return out; }

/* dom helpers */
function $(id){ return document.getElementById(id); }
function gridColor(){ return getComputedStyle(document.body).getPropertyValue('--grid').trim(); }

/* compute */
function computeSignals(){
  var t=timeVec(), re=new Array(N), im=new Array(N);
  for(var i=0;i<N;i++){ var th=omega*t[i]+phi; re[i]=A*Math.cos(th); im[i]=A*Math.sin(th); }
  var dre=null, dim=null, ire=null, iim=null;
  if(showDeriv){ dre=new Array(N); dim=new Array(N); for(var j=0;j<N;j++){ dre[j]=-omega*im[j]; dim[j]=omega*re[j]; } }
  if(showInt){ var k=1/omega; ire=new Array(N); iim=new Array(N); for(var m=0;m<N;m++){ ire[m]=k*im[m]; iim[m]=-k*re[m]; } }
  var mAbs=1, v,i;
  for(i=0;i<N;i++){ v=Math.abs(re[i]); if(v>mAbs)mAbs=v; v=Math.abs(im[i]); if(v>mAbs)mAbs=v; }
  if(dre){ for(i=0;i<N;i++){ v=Math.abs(dre[i]); if(v>mAbs)mAbs=v; v=Math.abs(dim[i]); if(v>mAbs)mAbs=v; } }
  if(ire){ for(i=0;i<N;i++){ v=Math.abs(ire[i]); if(v>mAbs)mAbs=v; v=Math.abs(iim[i]); if(v>mAbs)mAbs=v; } }
  return {t:t,re:re,im:im,dre:dre,dim:dim,ire:ire,iim:iim,maxAbs:1.1*mAbs};
}

/* view helpers */
function get3DView(){ if(!plot3D||!plot3D._fullLayout||!plot3D._fullLayout.scene) return {}; var cam=plot3D._fullLayout.scene.camera; var aspect=plot3D._fullLayout.scene.aspectmode||"auto"; return {camera:JSON.parse(JSON.stringify(cam)),aspect:aspect}; }
function getXRange(gd){ if(!gd||!gd._fullLayout||!gd._fullLayout.xaxis) return undefined; var r=gd._fullLayout.xaxis.range; return r?[r[0],r[1]]:undefined; }
function rangesEqual(a,b){ return a&&b&&a.length===2&&b.length===2&&Math.abs(a[0]-b[0])<1e-9&&Math.abs(a[1]-b[1])<1e-9; }

/* layouts */
function layout3D(maxAmp, includeCamera){
  var paper=getComputedStyle(document.body).getPropertyValue('--plot-paper').trim();
  var bg=getComputedStyle(document.body).getPropertyValue('--plot-bg').trim();
  var grid=gridColor(), s=span();
  var lay={ uirevision:"keep-3d", margin:{l:0,r:0,b:0,t:6},
    scene:{
      xaxis:{title:tr[lang].axisX3d,backgroundcolor:bg,range:[0,s],showgrid:true,gridcolor:grid},
      yaxis:{title:tr[lang].axisY3d,backgroundcolor:bg,range:[-maxAmp,maxAmp],showgrid:true,gridcolor:grid},
      zaxis:{title:tr[lang].axisZ3d,backgroundcolor:bg,range:[-maxAmp,maxAmp],showgrid:true,gridcolor:grid},
      aspectmode:"cube"
    },
    font:{color:getComputedStyle(document.body).getPropertyValue("--plot-font").trim()}, paper_bgcolor:paper, plot_bgcolor:bg, template: darkMode?"plotly_dark":"plotly_white",
    hovermode:false, legend:{x:1,y:0,xanchor:"right",yanchor:"bottom",bgcolor:"rgba(0,0,0,0)",itemwidth:60,itemsizing:"constant",font:{size:13}}
  };
  if(includeCamera){ lay.scene.camera={eye:{x:1.8,y:-1.8,z:1.2},up:{x:0,y:0,z:1},projection:{type:"orthographic"}}; }
  return lay;
}
function layout2D(titleY, xr, forceNewSpan){
  var paper=getComputedStyle(document.body).getPropertyValue('--plot-paper').trim();
  var bg=getComputedStyle(document.body).getPropertyValue('--plot-bg').trim();
  var grid=gridColor(), s=span();
  var xRange = forceNewSpan ? [0,s] : (xr || [0,s]);   // 1) update x-axis when periods change
  return {
    uirevision:"keep-2d",
    margin:{l:50,r:10,b:40,t:10},
    xaxis:{title:tr[lang].axisTime, range:xRange, showgrid:true, gridcolor:grid, hoverformat:".3f"},
    yaxis:{title:titleY, autorange:true, showgrid:true, gridcolor:grid, hoverformat:".3f"},
    font:{color:getComputedStyle(document.body).getPropertyValue("--plot-font").trim()}, paper_bgcolor:paper, plot_bgcolor:bg, template: darkMode?"plotly_dark":"plotly_white",
    hovermode:false, showlegend:false
  };
}

/* throttled update */
var rafPending=false;
function scheduleUpdate(){ if(rafPending) return; rafPending=true; requestAnimationFrame(function(){ updateAll(); rafPending=false; }); }

/* update */
function updateAll(){
  var dat=computeSignals();
  var view=get3DView();
  var currSpan = span();
  var spanChanged = Math.abs(currSpan - lastSpan) > 1e-9;

  var traces3d=[
    {type:"scatter3d",mode:"lines",x:dat.t,y:dat.re,z:dat.im,line:{width:W3D,color:COLORS.z},hoverinfo:"skip",name:"z(t)"},
    {type:"scatter3d",mode:"lines+markers",x:[0,0],y:[0, A*Math.cos(phi)],z:[0, A*Math.sin(phi)],
      line:{width:WPH,color:COLORS.z,dash:"dash"}, marker:{size:TIP_SIZE,color:COLORS.z,line:{width:1,color:COLORS.phasorTip}},
      hoverinfo:"skip",name:tr[lang].phasor+" z(t)"},
    {type:"scatter3d",mode:"lines",x:[0,0],y:[-A*1.2,A*1.2],z:[0,0],line:{color:AXIS_GRAY,width:3},showlegend:false},
    {type:"scatter3d",mode:"lines",x:[0,0],y:[0,0],z:[-A*1.2,A*1.2],line:{color:AXIS_GRAY,width:3},showlegend:false}
  ];
  if(showDeriv){
    var dy0=-omega*(A*Math.sin(phi)), dz0=omega*(A*Math.cos(phi));
    traces3d.push(
      {type:"scatter3d",mode:"lines",x:dat.t,y:dat.dre,z:dat.dim,line:{width:W3D,color:COLORS.dz},name:"dz/dt",hoverinfo:"skip"},
      {type:"scatter3d",mode:"lines+markers",x:[0,0],y:[0,dy0],z:[0,dz0],line:{width:WPH,color:COLORS.dz,dash:"dash"},
       marker:{size:TIP_SIZE,color:COLORS.dz,line:{width:1,color:COLORS.phasorTip}},hoverinfo:"skip",name:tr[lang].phasor+" dz/dt"}
    );
  }
  if(showInt){
    var iy0=(1/omega)*(A*Math.sin(phi)), iz0=-(1/omega)*(A*Math.cos(phi));
    traces3d.push(
      {type:"scatter3d",mode:"lines",x:dat.t,y:dat.ire,z:dat.iim,line:{width:W3D,color:COLORS.int},name:"∫z",hoverinfo:"skip"},
      {type:"scatter3d",mode:"lines+markers",x:[0,0],y:[0,iy0],z:[0,iz0],line:{width:WPH,color:COLORS.int,dash:"dash"},
       marker:{size:TIP_SIZE,color:COLORS.int,line:{width:1,color:COLORS.phasorTip}},hoverinfo:"skip",name:tr[lang].phasor+" ∫z"}
    );
  }

  lastDat=dat;
  traces3d.push({type:"scatter3d",mode:"markers",x:[],y:[],z:[],marker:{size:7,color:[],line:{width:2,color:darkMode?"#ffffff":"#111111"}},hoverinfo:"skip",showlegend:false,name:"hover"});
  hover3dIdx=traces3d.length-1;
  var lay=layout3D(dat.maxAbs,!initialized3D);
  if(view.camera){ var cam=JSON.parse(JSON.stringify(view.camera)); cam.projection=cam.projection||{}; cam.projection.type="orthographic"; lay.scene.camera=cam; }
  if(view.aspect){ lay.scene.aspectmode=view.aspect; }
  var cfg={responsive:true, displaylogo:false, displayModeBar:false};
  if(!initialized3D){ Plotly.newPlot("plot3d",traces3d,lay,cfg).then(function(gd){plot3D=gd; initialized3D=true;}); }
  else{ Plotly.react("plot3d",traces3d,lay,cfg).then(function(gd){plot3D=gd;}); }

  var xrRe=getXRange(plotRe);
  var trRe=[{type:"scatter",mode:"lines",x:dat.t,y:dat.re,line:{width:W2D,color:COLORS.z},name:"Re", hoverinfo:"skip"}];
  if(showDeriv) trRe.push({type:"scatter",mode:"lines",x:dat.t,y:dat.dre,line:{width:W2D,color:COLORS.dz},name:"Re{dz/dt}", hoverinfo:"skip"});
  if(showInt)   trRe.push({type:"scatter",mode:"lines",x:dat.t,y:dat.ire,line:{width:W2D,color:COLORS.int},name:"Re{∫z}", hoverinfo:"skip"});
  var layRe=layout2D(tr[lang].axisReal, xrRe, spanChanged);
  if(!initializedRe){ Plotly.newPlot("plotRe",trRe,layRe,cfg).then(function(gd){plotRe=gd; initializedRe=true; attachSyncIfReady();}); }
  else{ Plotly.react("plotRe",trRe,layRe,cfg).then(function(gd){plotRe=gd;}); }

  var xrIm=getXRange(plotIm);
  var trIm=[{type:"scatter",mode:"lines",x:dat.t,y:dat.im,line:{width:W2D,color:COLORS.z},name:"Im", hoverinfo:"skip"}];
  if(showDeriv) trIm.push({type:"scatter",mode:"lines",x:dat.t,y:dat.dim,line:{width:W2D,color:COLORS.dz},name:"Im{dz/dt}", hoverinfo:"skip"});
  if(showInt)   trIm.push({type:"scatter",mode:"lines",x:dat.t,y:dat.iim,line:{width:W2D,color:COLORS.int},name:"Im{∫z}", hoverinfo:"skip"});
  var layIm=layout2D(tr[lang].axisImag, xrIm, spanChanged);
  if(!initializedIm){ Plotly.newPlot("plotIm",trIm,layIm,cfg).then(function(gd){plotIm=gd; initializedIm=true; attachSyncIfReady();}); }
  else{ Plotly.react("plotIm",trIm,layIm,cfg).then(function(gd){plotIm=gd;}); }

  lastSpan = currSpan;
  if(window.MathJax && window.MathJax.typesetPromise){ MathJax.typesetPromise(); }
}

/* sync x-axes */
var syncing=false, syncAttached=false;
function attachSyncIfReady(){
  if(syncAttached || !plotRe || !plotIm) return;
  linkHover(); attachPan2D("plotRe"); attachPan2D("plotIm");
  function rangesEqual(a,b){ return a&&b&&a.length===2&&b.length===2&&Math.abs(a[0]-b[0])<1e-9&&Math.abs(a[1]-b[1])<1e-9; }
  function getXRange(gd){ if(!gd||!gd._fullLayout||!gd._fullLayout.xaxis) return undefined; var r=gd._fullLayout.xaxis.range; return r?[r[0],r[1]]:undefined; }
  function syncX(src,dst,ev){
    if(syncing||!ev) return;
    if('xaxis.autorange' in ev){ syncing=true; Plotly.relayout(dst,{'xaxis.autorange':ev['xaxis.autorange']}).then(function(){syncing=false;}); return; }
    if('xaxis.range[0]' in ev && 'xaxis.range[1]' in ev){
      var nr=[ev['xaxis.range[0]'],ev['xaxis.range[1]']]; var dr=getXRange(dst);
      if(!rangesEqual(dr,nr)){ syncing=true; Plotly.relayout(dst,{'xaxis.range':nr}).then(function(){syncing=false;}); }
    }
  }
  plotRe.on('plotly_relayout', function(ev){ syncX(plotRe,plotIm,ev); });
  plotIm.on('plotly_relayout', function(ev){ syncX(plotIm,plotRe,ev); });
  plotRe.on('plotly_doubleclick', function(){ Plotly.relayout(plotIm,{'xaxis.autorange':true}); });
  plotIm.on('plotly_doubleclick', function(){ Plotly.relayout(plotRe,{'xaxis.autorange':true}); });
  syncAttached=true;
}

/* Proximity hover, linked: when the pointer is near a curve in either 2D plot,
   the Re and Im values at that time are shown at once, each in its own plot. */
var hvEls={};
function makeOverlay(id){
  var host=$(id), o=document.createElement("div");
  o.className="hv"; o.innerHTML='<div class="hv-line"></div><div class="hv-label"></div>';
  host.appendChild(o); hvEls[id]={o:o,line:o.firstChild,label:o.lastChild,dots:[]};
}
function setHover3D(n){
  h3Pending=n; if(h3Raf) return;
  h3Raf=requestAnimationFrame(function(){
    h3Raf=0; if(!plot3D||hover3dIdx<0||!lastDat) return;
    var d=lastDat, x=[],y=[],z=[],c=[];
    if(h3Pending!==null && h3Pending<d.t.length){
      var m=h3Pending;
      x.push(d.t[m]); y.push(d.re[m]); z.push(d.im[m]); c.push(COLORS.z);
      if(d.dre){ x.push(d.t[m]); y.push(d.dre[m]); z.push(d.dim[m]); c.push(COLORS.dz); }
      if(d.ire){ x.push(d.t[m]); y.push(d.ire[m]); z.push(d.iim[m]); c.push(COLORS.int); }
    }
    // Update the marker AND re-pin the live camera in one call, so the user's
    // viewpoint (rotation, pan, zoom) can never be reset by the redraw.
    var sc=plot3D._fullLayout&&plot3D._fullLayout.scene, live=sc&&sc._scene&&sc._scene.getCamera&&sc._scene.getCamera(), lay={};
    if(live){ lay["scene.camera"]=JSON.parse(JSON.stringify(live)); lay["scene.aspectmode"]=sc.aspectmode; if(sc.aspectmode==="manual") lay["scene.aspectratio"]=JSON.parse(JSON.stringify(sc.aspectratio)); }
    Plotly.update(plot3D,{x:[x],y:[y],z:[z],"marker.color":[c]},lay,[hover3dIdx]);
  });
}
function hideHover(){ Object.keys(hvEls).forEach(function(k){ hvEls[k].o.style.display="none"; }); setHover3D(null); }
function drawHover(id,n){
  var g=$(id), e=hvEls[id], xa=g._fullLayout.xaxis, ya=g._fullLayout.yaxis;
  var px=xa._offset+xa.l2p(g.data[0].x[n]);
  if(px<xa._offset-0.5||px>xa._offset+xa._length+0.5){ e.o.style.display="none"; return; }
  e.o.style.display="block";
  e.line.style.left=px+"px"; e.line.style.top=ya._offset+"px"; e.line.style.height=ya._length+"px";
  var rows='<div class="hv-t">t = '+g.data[0].x[n].toFixed(3)+'</div>', topY=1e9;
  g.data.forEach(function(tr,i){
    var py=ya._offset+ya.l2p(tr.y[n]);
    if(!e.dots[i]){ var d=document.createElement("div"); d.className="hv-dot"; e.o.appendChild(d); e.dots[i]=d; }
    var d=e.dots[i]; d.style.display="block"; d.style.background=tr.line.color;
    d.style.left=px+"px"; d.style.top=py+"px"; topY=Math.min(topY,py);
    rows+='<div><span class="hv-sw" style="background:'+tr.line.color+'"></span>'+tr.name+' = '+tr.y[n].toFixed(3)+'</div>';
  });
  for(var j=g.data.length;j<e.dots.length;j++) e.dots[j].style.display="none";
  e.label.innerHTML=rows; e.label.style.display="block";
  var w=e.label.offsetWidth, h=e.label.offsetHeight;
  var lx=px+12; if(lx+w>xa._offset+xa._length) lx=px-12-w;
  var ly=Math.max(ya._offset+2, Math.min(topY-h/2, ya._offset+ya._length-h-2));
  e.label.style.left=lx+"px"; e.label.style.top=ly+"px";
}
function linkHover(){
  ["plotRe","plotIm"].forEach(function(id){
    makeOverlay(id);
    var g=$(id);
    g.addEventListener("mousemove", function(ev){
      if(ev.buttons){ hideHover(); return; }
      var xa=g._fullLayout.xaxis, ya=g._fullLayout.yaxis, r=g.getBoundingClientRect();
      var mx=ev.clientX-r.left, my=ev.clientY-r.top;
      var xs=g.data[0].x, last=xs[xs.length-1];
      var x=xa.p2l(mx-xa._offset), n0=Math.round(x/last*(xs.length-1)), best=1e9, bn=-1;
      for(var n=Math.max(0,n0-4); n<=Math.min(xs.length-1,n0+4); n++){
        g.data.forEach(function(tr){
          var dx=xa._offset+xa.l2p(xs[n])-mx, dy=ya._offset+ya.l2p(tr.y[n])-my, d=Math.sqrt(dx*dx+dy*dy);
          if(d<best){ best=d; bn=n; }
        });
      }
      if(bn>=0 && best<=22){ drawHover("plotRe",bn); drawHover("plotIm",bn); setHover3D(bn); } else hideHover();
    });
    g.addEventListener("mouseleave", hideHover);
    g.addEventListener("wheel", hideHover);
    g.on("plotly_relayout", hideHover);
  });
}

/* pan with right / middle button in the 2D plots */
function attachPan2D(id){
  var el=$(id), st=null;
  el.addEventListener("mousedown", function(e){
    if(e.button!==1&&e.button!==2) return;
    var gd=el, xa=gd._fullLayout.xaxis, ya=gd._fullLayout.yaxis;
    st={x:e.clientX,y:e.clientY,xr:xa.range.slice(),yr:ya.range.slice(),wx:xa._length,wy:ya._length};
    e.preventDefault(); e.stopPropagation();
  }, true);
  window.addEventListener("mousemove", function(e){
    if(!st) return;
    var dx=(e.clientX-st.x)/st.wx*(st.xr[1]-st.xr[0]), dy=(e.clientY-st.y)/st.wy*(st.yr[1]-st.yr[0]);
    Plotly.relayout(el,{"xaxis.range[0]":st.xr[0]-dx,"xaxis.range[1]":st.xr[1]-dx,"yaxis.range[0]":st.yr[0]+dy,"yaxis.range[1]":st.yr[1]+dy});
  });
  window.addEventListener("mouseup", function(){ st=null; });
  el.addEventListener("auxclick", function(e){ e.preventDefault(); });
}

/* pan with middle button in 3D: replay it as a right-button drag (Plotly pans with right) */
(function(){
  var el=$("plot3d"), mid=false;
  function fake(type,e){
    var t=(type==="mousedown")?e.target:(document.elementFromPoint(e.clientX,e.clientY)||e.target);
    t.dispatchEvent(new MouseEvent(type,{bubbles:true,cancelable:true,view:window,clientX:e.clientX,clientY:e.clientY,screenX:e.screenX,screenY:e.screenY,button:2,buttons:type==="mouseup"?0:2}));
  }
  el.addEventListener("mousedown", function(e){ if(e.button===1&&e.isTrusted){ mid=true; e.preventDefault(); e.stopImmediatePropagation(); fake("mousedown",e); } }, true);
  window.addEventListener("mousemove", function(e){ if(mid&&e.isTrusted){ e.stopImmediatePropagation(); fake("mousemove",e); } }, true);
  window.addEventListener("mouseup", function(e){ if(mid&&e.isTrusted){ mid=false; e.stopImmediatePropagation(); fake("mouseup",e); } }, true);
  el.addEventListener("auxclick", function(e){ e.preventDefault(); });
})();

/* views */
function setView(which){
  var eye,up,aspect="auto";
  if(which==="real"){ eye={x:0,y:0,z:2.8}; up={x:0,y:1,z:0}; }
  else if(which==="imag"){ eye={x:0,y:-2.8,z:0}; up={x:0,y:0,z:1}; }
  else if(which==="plane"){ eye={x:2.8,y:0,z:0}; up={x:0,y:0,z:1}; aspect="cube"; }
  else { eye={x:1.8,y:-1.8,z:1.2}; up={x:0,y:0,z:1}; aspect="cube"; }
  Plotly.relayout("plot3d",{"scene.camera.eye":eye,"scene.camera.up":up,"scene.camera.projection.type":"orthographic","scene.aspectmode":aspect});
}

function syncSidebarBtn(){

/* φ slider (integer 5° steps) */
$("slPhi").addEventListener("input", function(e){
  var deg = parseInt(e.target.value,10);
  if(deg>=180-1e-6) deg=180;
  phi = deg*RAD;
  $("valPhi").textContent = String(deg);
  $("hintPhiRad").textContent = "φ = "+phi.toFixed(2)+" rad";
  scheduleUpdate();
});

/* A slider: 1,2,3 */
$("slA").addEventListener("input", function(e){
  A = parseInt(e.target.value,10);
  $("valA").textContent = String(A);
  scheduleUpdate();
});

/* ω slider: snap to {0.75, 1, 1.5} */
function snapOmega(val){
  var opts=[0.75,1.0,1.5], best=opts[0], d=Math.abs(val-opts[0]);
  for(var i=1;i<opts.length;i++){ var dd=Math.abs(val-opts[i]); if(dd<d){d=dd; best=opts[i];} }
  return best;
}
$("slOmega").addEventListener("input", function(e){
  omega = snapOmega(parseFloat(e.target.value));
  $("slOmega").value = omega;               // snap the thumb to the nearest mark
  $("valOmega").textContent = (omega===1? "1" : (omega===1.5? "1.5" : "0.75"));
  scheduleUpdate();
});

/* periods slider: 1,2,3 */
$("slPeriods").addEventListener("input", function(e){
  periods = parseInt(e.target.value,10);
  $("valPeriods").textContent = String(periods);
  scheduleUpdate();
});

/* checkboxes */
$("cbDeriv").addEventListener("change", function(e){ showDeriv=e.target.checked; scheduleUpdate(); });
$("cbInt").addEventListener("change", function(e){ showInt=e.target.checked; scheduleUpdate(); });

/* defaults */
$("btnDefault").addEventListener("click", function(){
  A=1; omega=1; phi=-30*RAD; periods=1; showDeriv=false; showInt=false;
  $("slA").value=A; $("slOmega").value=omega; $("slPhi").value=-30; $("slPeriods").value=1;
  $("cbDeriv").checked=false; $("cbInt").checked=false;
  refreshTexts(); scheduleUpdate();
});

/* views */
$("viewReal").addEventListener("click", function(){ setView("real");});
$("viewImag").addEventListener("click", function(){ setView("imag");});
$("viewPlane").addEventListener("click", function(){ setView("plane");});
$("view3D").addEventListener("click", function(){ setView("3D");});

/* 1) double-click on the 3D plot: zoom fit (default camera) */
$("plot3d").addEventListener("dblclick", function(){ setTimeout(function(){ setView("3D"); },0); });

/* 3) no context menu anywhere */
document.addEventListener("contextmenu", function(e){ e.preventDefault(); });

/* 8) draggable splitter between 3D and 2D plots */
(function(){
  var sp=$("splitter"), plots=$("plots"), drag=false, raf=0;
  function resizeAll(){ if(raf) return; raf=requestAnimationFrame(function(){ raf=0; ["plot3d","plotRe","plotIm"].forEach(function(id){ try{Plotly.Plots.resize(id);}catch(e){} }); }); }
  sp.addEventListener("pointerdown", function(e){ drag=true; sp.setPointerCapture(e.pointerId); sp.classList.add("dragging"); document.body.style.userSelect="none"; e.preventDefault(); });
  sp.addEventListener("pointermove", function(e){
    if(!drag) return;
    var r=plots.getBoundingClientRect(), w=e.clientX-r.left-5;
    w=Math.max(r.width*0.25, Math.min(r.width*0.75, w));
    plots.style.setProperty("--w3d", w+"px"); resizeAll();
  });
  function end(e){ if(!drag) return; drag=false; sp.classList.remove("dragging"); document.body.style.userSelect=""; resizeAll(); }
  sp.addEventListener("pointerup", end); sp.addEventListener("pointercancel", end);
  sp.addEventListener("dblclick", function(){ plots.style.removeProperty("--w3d"); resizeAll(); });
})();

/* resize */
window.addEventListener("resize", function(){ Plotly.Plots.resize("plot3d"); Plotly.Plots.resize("plotRe"); Plotly.Plots.resize("plotIm"); });

/* modal */
var modal=$("modal");
$("btnInfo").addEventListener("click", function(){ modal.style.display="flex"; refreshTexts(); });
$("btnCloseModal").addEventListener("click", function(){ modal.style.display="none"; });
modal.addEventListener("click", function(e){ if(e.target===modal) modal.style.display="none"; });

/* init */
refreshTexts();
scheduleUpdate();
</script>
</body>
</html>
