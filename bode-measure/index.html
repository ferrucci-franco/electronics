<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Relevé de diagramme de Bode — RC / RLC</title>
<meta name="description" content="Manual Bode-plot measurement sheet for RC and series RLC circuits: type the oscilloscope readings, get gain and phase, the Bode plot and a printable report.">
<script>
  (function(){
    var hour = new Date().getHours();
    var mode = (hour >= 7 && hour < 18) ? 'light' : 'dark';
    document.documentElement.classList.add(mode);
  })();
</script>
<script defer src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --fg:#0f1222; --muted:#5a6275; --card:#eef4ff; --border:#d7e2f4; --link:#0b6cff; --accent:#2f6fde;
    --paper:#ffffff; --plot:#ffffff; --panel:#f6f8fc;
    --grid:#e6ebf3; --zero:#b9c3d6; --axis:#5a6275;
    --scroll-track:#e4ebf7; --scroll-thumb:#a8bbdb; --scroll-thumb-hover:#7f97bf;
    --c-meas:#1f77b4; --c-theory:#ff7f0e; --c-mark:#e0242b; --c-in:#888888;
    --computed:#f1f4fa; --invalid:#d9343f; --danger:#b3261e;
  }
  html.dark{
    --bg:#0b0e15; --fg:#eaf0ff; --muted:#a9b1c6; --card:#151d30; --border:#27324f; --link:#8ab4ff; --accent:#6d9cff;
    --paper:#111624; --plot:#111624; --panel:#0f1524;
    --grid:#1f2940; --zero:#3a4868; --axis:#a9b1c6;
    --scroll-track:#131b2e; --scroll-thumb:#415374; --scroll-thumb-hover:#5b739d;
    --c-meas:#4a9fe0; --c-theory:#ff9a3c; --c-mark:#ff4d55; --c-in:#9aa1ad;
    --computed:#0d1322; --invalid:#ff6b74; --danger:#ff8a80;
  }

  *{box-sizing:border-box}
  html, body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    overflow:hidden; -webkit-text-size-adjust:100%;
    /* no text selection (nor the iOS long-press callout) anywhere but in the input fields */
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  input, textarea{-webkit-user-select:text; user-select:text; -webkit-touch-callout:default}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ===== Layout: side panel (title, settings, table) on the left, Bode on the right, full height;
     each column scrolls on its own, so the plot stays in view while the table grows ===== */
  /* the side panel's width (--left-w) is set by the page: wide enough for the whole table when the window
     allows, or what the reader dragged the splitter to */
  .app{
    display:grid; gap:0; padding:10px;
    height:100vh; height:100dvh;
    grid-template-columns:var(--left-w, minmax(560px, 44%)) 12px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    grid-template-areas:"left split right";
  }
  .left{grid-area:left; display:flex; flex-direction:column; gap:10px; min-width:0; min-height:0; overflow:auto; overscroll-behavior:contain}
  /* splitter between the panels: drag to resize, double-click for the automatic width */
  .splitter{grid-area:split; position:relative; cursor:col-resize; touch-action:none; outline:none}
  .splitter::after{content:''; position:absolute; top:0; bottom:0; left:-5px; right:-5px; z-index:3}   /* easier to grab and to double-click */
  .splitter::before{content:''; position:absolute; top:8px; bottom:8px; left:50%; width:2px; margin-left:-1px; border-radius:2px; background:var(--border); transition:background .15s, width .15s}
  .splitter:hover::before, .splitter:focus-visible::before, .splitter.dragging::before{background:var(--accent); width:4px; margin-left:-2px}
  body.splitting, body.splitting *{cursor:col-resize !important; user-select:none !important}
  /* scrollbars: thin but always visible. Styled WebKit/Blink scrollbars are never the overlay kind that
     fades out (macOS, phones), so the extra columns and rows are always announced; Firefox gets the thin
     standard ones. (iOS ignores all of this: the table gets its own bar, see .hbar.) */
  .left::-webkit-scrollbar, .bodeWrap::-webkit-scrollbar, .table-wrap::-webkit-scrollbar{width:8px; height:8px}
  .left::-webkit-scrollbar-track, .bodeWrap::-webkit-scrollbar-track, .table-wrap::-webkit-scrollbar-track{background:var(--scroll-track); border-radius:999px}
  .left::-webkit-scrollbar-thumb, .bodeWrap::-webkit-scrollbar-thumb, .table-wrap::-webkit-scrollbar-thumb{background:var(--scroll-thumb); border-radius:999px}
  .left::-webkit-scrollbar-thumb:hover, .bodeWrap::-webkit-scrollbar-thumb:hover, .table-wrap::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover)}
  .left::-webkit-scrollbar-corner, .table-wrap::-webkit-scrollbar-corner{background:transparent}
  @supports not selector(::-webkit-scrollbar){
    .left, .bodeWrap, .table-wrap{scrollbar-width:thin; scrollbar-color:var(--scroll-thumb) var(--scroll-track)}
  }
  .right{grid-area:right; min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:6px}

  .panel{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .side-head{display:flex; flex-direction:column; gap:8px; padding:2px 2px 0; flex:none}
  .side-head .title-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px}
  .side-head h1{margin:0; font-size:18px; line-height:1.25; font-weight:700}
  .side-head .fit-row{display:inline-flex; gap:8px; align-items:center; font-size:14px; cursor:pointer; align-self:flex-start}
  .muted{color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:28px}
  label{font-size:15px}

  button, select, input[type=text]{
    border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px
  }
  select{min-width:150px; cursor:pointer}
  button{cursor:pointer}
  button:hover{filter:brightness(0.95)}
  button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button:disabled{cursor:not-allowed; opacity:.5; filter:none}
  input[type=checkbox]{width:18px; height:18px; margin:0; accent-color:var(--accent); cursor:pointer}

  .lang-theme{display:flex;gap:8px;align-items:center}
  .seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
  .side-head .seg button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:6px 11px;font-size:13px;font-weight:600}
  .side-head .seg button + button{border-left:1px solid var(--border)}
  .side-head .seg button.active{background:var(--accent);color:#fff}
  #themeBtn{padding:5px 10px; font-size:16px; line-height:1.2}

  .card{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:8px;flex:none}
  .card h3{margin:0 0 2px;font-size:15px}
  .grow{flex:1}
  .hint{font-size:12px;line-height:1.35}
  .copyright{font-size:12px;line-height:1.35;padding:2px 2px 0;margin-top:auto}
  .btn-accent{background:var(--accent) !important; color:#fff !important; border-color:var(--accent) !important}
  .btn-accent:hover{filter:brightness(1.08)}
  .btn-danger{color:var(--danger) !important}

  /* ----- circuit panel ----- */
  .circuit-grid{display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:start}
  /* labels next to their values; the circuit selector spans both columns, so its right edge
     lines up with the right edge of the value boxes */
  .comp-fields{display:grid; width:240px; grid-template-columns:minmax(0,1fr) 108px; gap:6px 12px; align-items:center}
  .comp-fields .span{grid-column:1 / -1}
  .comp-fields label{white-space:nowrap}
  .comp-fields .circuit-lbl{margin-bottom:-2px}
  .comp-fields select{width:100%; min-width:0}
  .comp-fields input[type=text]{width:100%; text-align:right; font-variant-numeric:tabular-nums}
  .comp-fields input.invalid{border-color:var(--invalid); box-shadow:0 0 0 1px var(--invalid) inset}
  .schematic{width:340px; max-width:100%; color:var(--fg); justify-self:center}
  .schematic svg{height:auto; display:block; margin:0 auto}
  .schematic text{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif; font-size:13px; fill:var(--fg)}
  .schematic .sub{font-size:9px}
  .schematic .sign{font-size:15px; font-weight:700}
  .schematic .vin{fill:var(--c-in)} .schematic .vout{fill:var(--c-meas)}
  .schematic path, .schematic line, .schematic circle, .schematic rect{stroke:var(--fg); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  .schematic circle.node{fill:var(--fg); stroke:none}
  [hidden]{display:none !important}

  /* ----- fake "disabled" checkbox (toggled with Ctrl+Shift+click) ----- */
  .theory-row{cursor:default; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
  .theory-row.on{cursor:pointer}
  .fake-check{
    display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:4px;
    border:1.5px solid var(--muted); background:var(--computed); color:var(--muted); font-size:13px; line-height:1; opacity:.55;
  }
  .fake-check[aria-checked="true"]::after{content:'✔'}
  .disabled-label{color:var(--muted); opacity:.6}
  .theory-values dl{display:grid; grid-template-columns:auto auto; gap:4px 14px; margin:0; font-size:14px; justify-content:start}
  .theory-values dt{margin:0; color:var(--muted)}
  .theory-values dd{margin:0; font-variant-numeric:tabular-nums; font-weight:600}

  /* ----- measurement table ----- */
  .table-wrap{overflow-x:auto}
  .table-wrap.has-x-scroll{padding-bottom:2px}
  /* the table's own horizontal bar, shown only where the native one fades out (iOS, overlay scrollbars) */
  .hbar{position:relative; height:6px; margin-top:4px; border-radius:999px; background:var(--scroll-track); touch-action:none; cursor:pointer}
  .hbar[hidden]{display:none}
  .hbar-thumb{position:absolute; top:0; bottom:0; left:0; border-radius:999px; background:var(--scroll-thumb)}
  .hbar:active .hbar-thumb{background:var(--scroll-thumb-hover)}
  table.meas{border-collapse:separate; border-spacing:0; width:100%; font-size:14px}
  table.meas th, table.meas td{border-bottom:1px solid var(--border); padding:3px 4px; text-align:center; white-space:nowrap}
  table.meas th{font-weight:600; font-size:13px; padding-bottom:6px; cursor:help}
  table.meas th.nohelp{cursor:default}
  table.meas td.editable input{width:100%; min-width:76px; text-align:right; padding:5px 7px; border-radius:8px; background:var(--paper); font-variant-numeric:tabular-nums}
  table.meas td.editable input.invalid{border-color:var(--invalid); box-shadow:0 0 0 1px var(--invalid) inset}
  table.meas td.computed{background:var(--computed); color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; padding:5px 9px; min-width:76px; user-select:none; -webkit-user-select:none}
  table.meas td.computed:empty::after{content:'—'; opacity:.35}
  table.meas th.computed{background:var(--computed); border-radius:6px 6px 0 0}
  table.meas tr:last-child td{border-bottom:0}
  table.meas td.actions{width:34px; padding:0 2px}
  .row-del{border:0; background:transparent; color:var(--muted); font-size:18px; line-height:1; padding:4px 7px; border-radius:8px}
  .row-del:hover{color:var(--danger); background:var(--computed); filter:none}
  .table-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .table-actions .spacer{flex:1}

  /* how G, G_dB and φ are computed (KaTeX) */
  .formulas{border:1px solid var(--border); border-radius:10px; padding:8px 12px; background:var(--computed); font-size:13px; line-height:1.45; color:var(--muted)}
  .formulas h4{margin:0 0 4px; font-size:13px; color:var(--fg)}
  .formulas p{margin:4px 0}
  .formulas .eqs{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:2px 28px; margin:4px 0; color:var(--fg); font-size:15px}
  .formulas .katex{font-size:1.05em}
  .formulas .eqs .katex{font-size:1.12em}
  .dt-note{display:grid; grid-template-columns:1fr 240px; gap:10px; align-items:center}
  .dt-note svg{width:100%; height:auto; display:block}
  /* narrow screens: the note above, the drawing below at the full width of the card */
  @media (max-width:699px){
    .dt-note{grid-template-columns:minmax(0,1fr)}
    #dtDrawing{width:100%; max-width:420px; justify-self:center}
  }
  .dt-note .dt-in{stroke:var(--c-in)} .dt-note .dt-out{stroke:var(--c-meas)}
  .dt-note text{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif; font-size:11px; fill:var(--fg)}
  .dt-note .axis{stroke:var(--zero); stroke-width:1}
  .dt-note .dim{stroke:var(--c-mark); stroke-width:1.2}
  .dt-note .guide{stroke:var(--c-mark); stroke-width:1; stroke-dasharray:3 3}

  /* ----- report fields ----- */
  .report-fields{display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center}
  .report-fields input[type=text]{width:100%}
  .report-fields .date{font-variant-numeric:tabular-nums}

  .confirm-box{border:1px solid var(--danger); border-radius:12px; padding:10px 12px; background:var(--computed); display:flex; flex-direction:column; gap:8px}
  .confirm-box .row{justify-content:flex-end}

  /* ----- Bode ----- */
  .plotwrap.panel{background:var(--paper); padding:8px}
  .bodeWrap{display:flex;flex-direction:column;gap:8px;min-height:0; flex:1 1 auto; overflow:auto; overscroll-behavior:contain}
  /* "fit" (default): both plots share the panel height, no scroll */
  /* not scrollable itself: a scroll that starts on the plots must reach the page */
  .right.fit .bodeWrap{overflow:hidden; overscroll-behavior:auto}
  .plot-cell{position:relative; width:100%; min-height:0}
  .plot-cell > .plot{width:100%; height:100%}
  .right.fit #magCell{flex:11 1 0}
  .right.fit #phaseCell{flex:9 1 0}
  /* unfit: comfortable fixed heights, the Bode column scrolls */
  .right:not(.fit) #magCell{flex:none; height:480px}
  .right:not(.fit) #phaseCell{flex:none; height:420px}
  /* Fit X / Fit Y / Fit all: small semi-transparent buttons in the top-right corner of each plot */
  .plot-fit-btns{position:absolute; top:8px; right:10px; z-index:5; display:flex; gap:4px}
  .plot-fit-btns button{width:28px; height:28px; padding:4px; border-radius:7px; border:1px solid var(--border); background:var(--card);
                        color:var(--fg); opacity:.5; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:opacity .15s}
  .plot-fit-btns button:focus-visible{opacity:1; filter:none}
  /* phones keep :hover after a tap: only a real pointer lights the buttons up */
  @media (hover:hover){ .plot-fit-btns button:hover{opacity:1; filter:none} }
  .plot-fit-btns svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  /* the legend lies inside the plot, in a corner, with a small show/hide button at that corner
     (as in timeseries-explorer); hiding it is a class, so the figure itself is never changed */
  .js-plotly-plot.legend-collapsed .infolayer .legend{display:none}
  .legend-toggle-btn{position:absolute; z-index:6; display:flex; align-items:center; justify-content:center; width:22px; height:22px; padding:0;
                     border:1px solid color-mix(in srgb, var(--border) 70%, transparent); border-radius:5px;
                     background:color-mix(in srgb, var(--paper) 80%, transparent); color:var(--fg); opacity:.6; cursor:pointer; touch-action:manipulation}
  .legend-toggle-btn[hidden]{display:none}
  .legend-toggle-btn:focus-visible{opacity:1}
  @media (hover:hover){ .legend-toggle-btn:hover{opacity:1; filter:none} }
  .legend-toggle-btn.is-open{color:var(--accent)}
  .legend-toggle-btn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round}
  /* a finger needs a bigger target */
  @media (pointer:coarse){
    .plot-fit-btns{gap:6px}
    .plot-fit-btns button{width:36px; height:36px; border-radius:10px; background:color-mix(in srgb, var(--card) 70%, transparent)}
    .plot-fit-btns svg{width:20px; height:20px}
    .legend-toggle-btn{width:36px; height:36px; border-radius:10px; border-color:color-mix(in srgb, var(--border) 60%, transparent)}
    .legend-toggle-btn svg{width:20px; height:20px}
    .legend-toggle-btn.is-open{opacity:.9; background:color-mix(in srgb, var(--accent) 14%, var(--paper))}
  }
  .plotly-notifier{display:none !important}
  /* one-finger gestures on the plots: the browser scrolls natively unless the page blocks it for a
     pan or a zoom; "manipulation" removes the browser's double-tap zoom, which is our "fit" */
  #bodeMag, #bodePhase{touch-action:manipulation}
  /* the zoom window a finger draws: a band of x (edges left/right), of y (edges top/bottom), or a box */
  .zoom-sel{position:fixed; display:none; pointer-events:none; z-index:40; box-sizing:border-box; background:color-mix(in srgb, var(--accent) 16%, transparent);
            border-left:2px solid var(--accent); border-right:2px solid var(--accent)}
  .zoom-sel.is-y{border:none; border-top:2px solid var(--accent); border-bottom:2px solid var(--accent)}
  .zoom-sel.is-xy{border:2px solid var(--accent)}
  /* after a slow double tap, the line that says the plot waits for the drag */
  .zoom-hint{position:fixed; display:none; pointer-events:none; z-index:42; transform:translate(-50%, -100%); max-width:min(90vw, 360px);
             padding:6px 12px; border-radius:12px; border:1px solid var(--accent); background:color-mix(in srgb, var(--paper) 92%, transparent);
             color:var(--fg); font-size:13px; line-height:1.3; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.18)}
  /* a tap's tooltip would come back at every redraw of a gesture, over a point nobody touches */
  .js-plotly-plot.touch-gesture .hoverlayer{display:none}
  .touch-ring{position:fixed; display:none; pointer-events:none; z-index:41; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%;
              border:2px solid var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent)}
  body.panning, body.panning *{cursor:grabbing !important}
  body.panning{user-select:none; -webkit-user-select:none}

  @media (max-width:1099px){
    body{overflow:auto}
    .app{height:auto; min-height:100vh; gap:10px; grid-template-columns:minmax(0,1fr) !important; grid-template-rows:none; grid-template-areas:"left" "right"}
    .splitter{display:none}
    .left{overflow:visible}
    .right{height:760px}
    /* one column: the Bode block has a fixed height and always fills it, so the option is meaningless */
    .side-head .fit-row{display:none}
  }
  /* phones: the schematic goes above the component fields and takes the full width of the card */
  @media (max-width:699px){
    .app{grid-template-columns:minmax(0,1fr)}
    .circuit-grid{grid-template-columns:minmax(0,1fr)}
    .schematic{order:-1; width:100%; justify-self:stretch}
    .right{height:640px}
  }

  /* ===== Print report (A4 portrait, light theme) ===== */
  #report{display:none}
  @media print{
    @page{size:A4 portrait; margin:11mm 12mm}
    :root, html.dark{
      --bg:#ffffff; --fg:#000000; --muted:#444c5c; --card:#ffffff; --border:#9aa4b8; --paper:#ffffff; --computed:#f1f4fa;
    }
    html, body{background:#fff !important; color:#000 !important; overflow:visible !important; height:auto !important}
    .app{display:none !important}
    #report{display:block; font-size:10.5pt; color:#000}
    #report .page{break-after:page; page-break-after:always}
    #report .page:last-child{break-after:auto; page-break-after:auto}
    #report h1{font-size:15pt; margin:0 0 4mm}
    #report h2{font-size:12pt; margin:3mm 0 1mm; padding:1.5mm 2.5mm; background:#eef2f8; border-radius:1.5mm}
    #report p.comps{margin:0 0 2mm; padding:0 2.5mm; font-size:10pt}
    #report .meta{display:grid; grid-template-columns:auto 1fr auto 1fr; gap:1.5mm 4mm; margin:0 0 2mm; font-size:10pt}
    #report .meta dt{color:#444; margin:0} #report .meta dd{margin:0; font-weight:600}
    #report .body{display:grid; grid-template-columns:minmax(0,1fr) 98mm; gap:3mm; align-items:start}
    #report table{border-collapse:collapse; width:100%; font-size:8.5pt; table-layout:auto}
    #report th, #report td{border:0.3pt solid #9aa4b8; padding:0.8mm 1.5mm; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
    #report th{background:#eef2f8; text-align:center; font-weight:600; white-space:normal; line-height:1.15}
    #report td.c{background:#f6f8fb; color:#333}
    #report .plots img{display:block; width:98mm; height:auto}
    #report .plots img + img{margin-top:1mm}
    #report .theory{margin-top:2mm; font-size:9.5pt}
    #report .formulas{margin-top:2mm; padding:1.5mm 2.5mm; border:0.3pt solid #9aa4b8; border-radius:1.5mm; background:#f6f8fb; font-size:9pt; color:#222}
    #report .formulas h4{font-size:9.5pt; margin:0 0 1mm; color:#000}
    #report .formulas p{margin:1mm 0}
    #report .formulas .eqs{display:flex; flex-wrap:wrap; justify-content:center; gap:0 6mm; margin:1mm 0; font-size:10pt; color:#000}
    #report .theory ul{margin:1mm 0 0; padding-left:5mm}
    #report .foot{margin-top:3mm; font-size:8pt; color:#555}
    #report .foot .line{border-top:0.3pt solid #9aa4b8; margin-top:3mm; padding-top:1mm}
  }
</style>
<!-- Contador de visitas (GoatCounter, sin cookies ni datos personales). No cuenta en localhost ni desde file://. -->
<script data-goatcounter="https://ferrucci-franco.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

<body>
  <div class="app" id="app">
    <!-- ===== Left column: title and settings, circuit, report fields, table ===== -->
    <aside class="panel left" style="background:var(--panel)">

      <div class="side-head">
        <div class="title-row">
          <h1 id="title">Relevé de diagramme de Bode — RC / RLC série</h1>
          <div class="lang-theme">
            <div class="seg" role="group" aria-label="Langue">
              <button id="lang-fr" type="button" class="active" data-lang="fr" aria-pressed="true">FR</button>
              <button id="lang-en" type="button" data-lang="en" aria-pressed="false">EN</button>
              <button id="lang-es" type="button" data-lang="es" aria-pressed="false">ES</button>
            </div>
            <button id="themeBtn" type="button" title="Changer de thème" aria-label="Changer de thème">🌗</button>
          </div>
        </div>
        <label class="fit-row"><input id="fitBode" type="checkbox" checked /><span id="fitBodeLbl">Ajuster le Bode à la hauteur</span></label>
      </div>

      <!-- Circuit -->
      <div class="card">
        <h3 id="circuitCardTitle">Circuit</h3>
        <div class="circuit-grid">
          <div class="comp-fields">
            <label for="circuitSel" id="circuitLbl" class="span circuit-lbl">Type de circuit</label>
            <select id="circuitSel" class="span">
              <option value="rc" id="optRc">RC</option>
              <option value="rlc" id="optRlc">RLC série</option>
            </select>
            <label for="outSel" id="outLbl" class="span circuit-lbl">V<sub>out</sub> mesurée aux bornes de</label>
            <select id="outSel" class="span"></select>
            <label for="compR" id="lblR">R (Ω)</label>
            <input id="compR" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
            <label for="compC" id="lblC">C (nF)</label>
            <input id="compC" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
            <label for="compL" id="lblL" class="rlc-only">L (mH)</label>
            <input id="compL" class="rlc-only" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
            <label for="compRL" id="lblRL" class="rlc-only">R<sub>L</sub> bobine (Ω)</label>
            <input id="compRL" class="rlc-only" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
          </div>
          <div class="schematic" id="schematic" aria-hidden="true"></div>
        </div>
        <div class="muted hint" id="outHint"></div>
        <div class="muted hint" id="circuitHint"></div>

        <!-- hidden theory curve (Ctrl+Shift+click) -->
        <div class="row theory-row" id="theoryRow" title="">
          <span class="fake-check" id="theoryCheck" role="checkbox" aria-checked="false" aria-disabled="true" tabindex="-1"></span>
          <span id="theoryLabel" class="disabled-label">Afficher la courbe théorique</span>
        </div>
        <div class="theory-values" id="theoryValues" hidden></div>
      </div>

      <!-- Report fields -->
      <div class="card">
        <h3 id="reportCardTitle">Rapport</h3>
        <div class="report-fields">
          <label for="namesIn" id="namesLbl">Noms</label>
          <input id="namesIn" type="text" autocomplete="off" />
          <label for="groupIn" id="groupLbl">Groupe / paillasse</label>
          <input id="groupIn" type="text" autocomplete="off" />
          <span id="dateLbl">Date</span>
          <span class="date" id="dateVal"></span>
        </div>
        <div class="row">
          <button id="printBtn" type="button" class="btn-accent">Imprimer le rapport (PDF)</button>
          <button id="csvBtn" type="button">Exporter CSV</button>
          <span class="spacer grow"></span>
          <button id="newBtn" type="button" class="btn-danger">Nouvelle série de mesures</button>
        </div>
        <div class="muted hint" id="reportHint"></div>
        <div class="confirm-box" id="confirmBox" hidden>
          <div id="confirmText">Effacer toutes les mesures, les valeurs des composants et les noms ?</div>
          <div class="row">
            <button id="confirmNo" type="button">Annuler</button>
            <button id="confirmYes" type="button" class="btn-danger">Oui, tout effacer</button>
          </div>
        </div>
      </div>

      <!-- Measurement table -->
      <div class="card">
        <h3 id="tableCardTitle">Mesures</h3>
        <div class="muted hint" id="measHint"></div>
        <div class="table-wrap">
          <table class="meas" id="measTable">
            <thead>
              <tr>
                <th class="nohelp" id="thF">f (Hz)</th>
                <th id="thVe">V<sub>in,pp</sub> (V)</th>
                <th id="thVs">V<sub>out,pp</sub> (V)</th>
                <th id="thDt">ΔT (µs)</th>
                <th class="computed" id="thG">G (V/V)</th>
                <th class="computed" id="thGdb">G<sub>dB</sub> (dB)</th>
                <th class="computed" id="thPhi">φ (°)</th>
                <th class="nohelp"></th>
              </tr>
            </thead>
            <tbody id="measBody"></tbody>
          </table>
        </div>
        <div class="hbar" id="tableHbar" hidden><div class="hbar-thumb"></div></div>
        <div class="table-actions">
          <button id="addRowBtn" type="button">+ Ajouter une ligne</button>
          <button id="clearTableBtn" type="button" class="btn-danger">Vider le tableau</button>
          <span class="spacer"></span>
          <span class="muted hint" id="rowsHint"></span>
        </div>
        <div class="confirm-box" id="clearBox" hidden>
          <div id="clearText"></div>
          <div class="row">
            <button id="clearNo" type="button">Annuler</button>
            <button id="clearYes" type="button" class="btn-danger">Oui, vider ce tableau</button>
          </div>
        </div>
        <div class="formulas" id="formulas"></div>
        <div class="dt-note">
          <div class="muted hint" id="dtNote"></div>
          <div id="dtDrawing" aria-hidden="true"></div>
        </div>
      </div>

      <div class="muted copyright">
        © 2025 Franco Ferrucci<br>
        <a href="https://ferrucci-lab.com/" target="_blank" rel="noopener">ferrucci-lab.com</a>
      </div>
    </aside>

    <!-- ===== Right column: Bode plot ===== -->
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>

    <section class="panel plotwrap right fit" id="bodeSection">
      <div class="bodeWrap">
        <div class="plot-cell" id="magCell"><div id="bodeMag" class="plot"></div><div class="plot-fit-btns" data-plot="bodeMag"></div></div>
        <div class="plot-cell" id="phaseCell"><div id="bodePhase" class="plot"></div><div class="plot-fit-btns" data-plot="bodePhase"></div></div>
      </div>
    </section>
  </div>

  <!-- ===== Printable report (filled just before printing) ===== -->
  <div id="report" aria-hidden="true"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';

  // ========= Helpers =========
  const $ = s => document.querySelector(s);
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const log10 = x => Math.log(x) / Math.LN10;
  const TWO_PI = 2 * Math.PI;
  const STORE_KEY = 'bode-measure-v2';
  const STORE_KEY_V1 = 'bode-measure-v1';
  const LANG_KEY = 'bode-measure-lang';
  const LOCALES = {fr:'fr-FR', en:'en-US', es:'es-ES'};
  const DEFAULT_ROWS = 8;

  // ========= Texts =========
  const TXT = {

      R:'R (Ω)', C:'C (nF)', L:'L (mH)', RL:'R<sub>L</sub> bobine (Ω)',

      confirmText:'Effacer toutes les mesures (RC et RLC), les valeurs des composants et les noms ?', confirmYes:'Oui, tout effacer', confirmNo:'Annuler',
      clearTable:'Vider le tableau', clearYes:'Oui, vider ce tableau',
      clearText:cfg => `Effacer toutes les mesures du tableau affiché (${cfg}) ? Les autres tableaux, les valeurs des composants et les noms sont conservés.`,

      fc:'Fréquence de coupure f<sub>c</sub>', f0:'Fréquence de résonance f<sub>0</sub>', Q:'Facteur de qualité Q',
      invalidComp:'Valeurs de composants invalides : la courbe théorique ne peut pas être tracée.',
      bodeTitle:'Bode — Gain', bodePhaseTitle:'Bode — Phase', bodeX:'Fréquence (Hz)', bodeYdB:'G (dB)', phaseY:'Phase (°)',
      traceMeas:'Mesures', traceTh:'Théorie', fitBode:'Ajuster le Bode à la hauteur', fitX:'Ajuster X', fitY:'Ajuster Y', fitAll:'Tout ajuster',

    },
    en:{
      title:'Bode Plot Measurement Sheet — RC / series RLC',
      circuitCard:'Circuit', circuitType:'Circuit type', rc:'RC', rlc:'Series RLC',
      R:'R (Ω)', C:'C (nF)', L:'L (mH)', RL:'R<sub>L</sub> coil (Ω)',
      circuitHint:'Switching circuit or measured component erases nothing: each combination keeps its own measurement table (component values belong to each circuit).',
      nMeas:n => n === 1 ? '1 measurement' : n + ' measurements',
      outLbl:'V<sub>out</sub> measured across', outOpt:{C:'C (capacitor)', R:'R (resistor)', L:'L (coil)'},
      outHint:'Put the measured component on the ground side, as in the schematic: both oscilloscope channels share a common ground.',
      outHintL:'Across the real coil, the measured voltage includes its resistance R<sub>L</sub>.',
      reportOut:'V<sub>out</sub> across', csvOut:'V_out across',
      measHint:'Measure V<sub>in</sub> at the circuit input terminals (channel 1), not on the generator display.',
      dtNote:'ΔT = time between a rising zero crossing of the input and the next rising zero crossing of the output (output lags: ΔT &gt; 0, φ &lt; 0). If the output leads, type ΔT &lt; 0. In every case φ is brought within ±180° of the range expected for this set-up.',
      dtTip:'ΔT = time between a rising zero crossing of the input and the next rising zero crossing of the output (output lags: ΔT > 0, φ < 0; output leads: ΔT < 0).',
      veTip:'Input peak-to-peak voltage (channel 1), measured at the circuit terminals.',
      vsTip:o => `Output peak-to-peak voltage (channel 2), across ${o}.`,
      gTip:'G = V_out,pp / V_in,pp', gdbTip:'G_dB = 20·log10(G)', phiTip:'φ = −360 · f · ΔT  (ΔT in seconds)',
      tableCard:'Measurements', addRow:'+ Add a row', delRow:'Delete this row',
      rowsHint:'Decimal comma or point accepted. Rows can be typed in any order: the plot sorts them by frequency.',
      reportCard:'Report', names:'Names', group:'Group / bench', date:'Date',
      print:'Print the report (PDF)', csv:'Export CSV', newSeries:'New measurement series',
      reportHint:'The report and the CSV include every circuit / measured-component combination that has measurements (one page per combination).',
      confirmText:'Clear all measurements (RC and RLC), component values and names?', confirmYes:'Yes, clear everything', confirmNo:'Cancel',
      clearTable:'Clear table', clearYes:'Yes, clear this table',
      clearText:cfg => `Delete all measurements in the table shown (${cfg})? The other tables, the component values and the names are kept.`,
      theory:'Show the theoretical curve', theoryTitle:'Characteristic values (theory)',
      fc:'Cutoff frequency f<sub>c</sub>', f0:'Resonance frequency f<sub>0</sub>', Q:'Quality factor Q',
      invalidComp:'Invalid component values: the theoretical curve cannot be drawn.',
      bodeTitle:'Bode — Gain', bodePhaseTitle:'Bode — Phase', bodeX:'Frequency (Hz)', bodeYdB:'G (dB)', phaseY:'Phase (°)',
      traceMeas:'Measurements', traceTh:'Theory', fitBode:'Fit Bode to the height', fitX:'Fit X', fitY:'Fit Y', fitAll:'Fit all',
      legendShow:'Show legend', legendHide:'Minimize legend',
      splitter:'Drag to resize the panels (double-click: automatic width)',
      zoomHint:'Drag sideways to zoom on X, up or down to zoom on Y, diagonally for a window',
      reportCircuit:'Circuit', reportTheory:'Theoretical curve shown',
      reportFoot:'Measured with ferrucci-lab.com/bode-measure',
      theme:'Toggle theme', language:'Language',
      csvComment:'Bode plot measurement sheet'
    },
    es:{
      title:'Hoja de medición de diagrama de Bode — RC / RLC serie',
      circuitCard:'Circuito', circuitType:'Tipo de circuito', rc:'RC', rlc:'RLC serie',
      R:'R (Ω)', C:'C (nF)', L:'L (mH)', RL:'R<sub>L</sub> bobina (Ω)',
      circuitHint:'Cambiar de circuito o de componente medido no borra nada: cada combinación conserva su propia tabla de mediciones (los valores de los componentes son propios de cada circuito).',
      nMeas:n => n === 1 ? '1 medición' : n + ' mediciones',
      outLbl:'V<sub>out</sub> medida en bornes de', outOpt:{C:'C (capacitor)', R:'R (resistencia)', L:'L (bobina)'},
      outHint:'Coloque el componente medido del lado de masa, como en el esquema: los dos canales del osciloscopio tienen una masa común.',
      outHintL:'En bornes de la bobina real, la tensión medida incluye su resistencia R<sub>L</sub>.',
      reportOut:'V<sub>out</sub> en bornes de', csvOut:'V_out en bornes de',
      measHint:'Mida V<sub>in</sub> en los bornes de entrada del circuito (canal 1), no en la pantalla del generador.',
      dtNote:'ΔT = tiempo entre el cruce ascendente de la entrada y el siguiente cruce ascendente de la salida (salida retrasada: ΔT &gt; 0, φ &lt; 0). Si la salida está adelantada, escriba ΔT &lt; 0. En todos los casos φ se lleva a ±180° alrededor del rango esperado para este montaje.',
      dtTip:'ΔT = tiempo entre el cruce ascendente de la entrada y el siguiente cruce ascendente de la salida (salida retrasada: ΔT > 0, φ < 0; salida adelantada: ΔT < 0).',
      veTip:'Tensión de entrada pico a pico (canal 1), medida en los bornes del circuito.',
      vsTip:o => `Tensión de salida pico a pico (canal 2), en bornes de ${o}.`,
      gTip:'G = V_out,pp / V_in,pp', gdbTip:'G_dB = 20·log10(G)', phiTip:'φ = −360 · f · ΔT  (ΔT en segundos)',
      tableCard:'Mediciones', addRow:'+ Agregar una fila', delRow:'Eliminar esta fila',
      rowsHint:'Se acepta coma o punto decimal. Las filas pueden escribirse en cualquier orden: el gráfico las ordena por frecuencia.',
      reportCard:'Informe', names:'Nombres', group:'Grupo / banco', date:'Fecha',
      print:'Imprimir el informe (PDF)', csv:'Exportar CSV', newSeries:'Nueva serie de mediciones',
      reportHint:'El informe y el CSV incluyen cada combinación circuito / componente medido que tenga mediciones (una página por combinación).',
      confirmText:'¿Borrar todas las mediciones (RC y RLC), los valores de los componentes y los nombres?', confirmYes:'Sí, borrar todo', confirmNo:'Cancelar',
      clearTable:'Vaciar la tabla', clearYes:'Sí, vaciar esta tabla',
      clearText:cfg => `¿Borrar todas las mediciones de la tabla visible (${cfg})? Las demás tablas, los valores de los componentes y los nombres se conservan.`,
      theory:'Mostrar la curva teórica', theoryTitle:'Valores característicos (teoría)',
      fc:'Frecuencia de corte f<sub>c</sub>', f0:'Frecuencia de resonancia f<sub>0</sub>', Q:'Factor de calidad Q',
      invalidComp:'Valores de componentes inválidos: no se puede trazar la curva teórica.',
      bodeTitle:'Bode — Ganancia', bodePhaseTitle:'Bode — Fase', bodeX:'Frecuencia (Hz)', bodeYdB:'G (dB)', phaseY:'Fase (°)',
      traceMeas:'Mediciones', traceTh:'Teoría', fitBode:'Ajustar el Bode a la altura', fitX:'Ajustar X', fitY:'Ajustar Y', fitAll:'Ajustar todo',
      legendShow:'Mostrar leyenda', legendHide:'Minimizar leyenda',
      splitter:'Arrastrar para redimensionar los paneles (doble clic: ancho automático)',
      zoomHint:'Arrastra de lado para ampliar en X, arriba o abajo para ampliar en Y, en diagonal para una ventana',
      reportCircuit:'Circuito', reportTheory:'Curva teórica mostrada',
      reportFoot:'Medido con ferrucci-lab.com/bode-measure',
      theme:'Cambiar tema', language:'Idioma',
      csvComment:'Hoja de medición de diagrama de Bode'
    }
  };

  // ========= Formulas shown under the table (and in the report) =========
  // \( … \) inline math, $$ … $$ displayed math; rendered by KaTeX, plain TeX text until it has loaded
  const FORMULAS = {
    fr:String.raw`<h4>Formules</h4>
      <p><b>Gain</b> : rapport des amplitudes crête à crête, puis en décibels :</p>
      <div class="eqs"><span>$$G = \frac{V_{\text{out,pp}}}{V_{\text{in,pp}}}$$</span><span>$$G_{\text{dB}} = 20\,\log_{10} G$$</span></div>
      <p><b>Phase</b> : une période \(T = 1/f\) correspond à 360°. Un retard \(\Delta T\) de la sortie est donc une fraction \(\Delta T/T\) de tour :</p>
      <div class="eqs"><span>$$\varphi = -360^\circ\,\frac{\Delta T}{T} = -360^\circ \cdot f \cdot \Delta T$$</span></div>
      <p>avec \(\Delta T\) en secondes (le tableau le saisit en µs). Exemple : \(f = 1\ \text{kHz}\), \(V_{\text{in,pp}} = 4\ \text{V}\), \(V_{\text{out,pp}} = 3{,}39\ \text{V}\), \(\Delta T = 89{,}2\ \mu\text{s}\) donnent \(G = 0{,}848\), \(G_{\text{dB}} = -1{,}4\ \text{dB}\) et \(\varphi = -360 \times 1000 \times 89{,}2\cdot 10^{-6} = -32{,}1^\circ\).</p>`,
    en:String.raw`<h4>Formulas</h4>
      <p><b>Gain</b>: ratio of the peak-to-peak amplitudes, then in decibels:</p>
      <div class="eqs"><span>$$G = \frac{V_{\text{out,pp}}}{V_{\text{in,pp}}}$$</span><span>$$G_{\text{dB}} = 20\,\log_{10} G$$</span></div>
      <p><b>Phase</b>: one period \(T = 1/f\) is 360°. A delay \(\Delta T\) of the output is therefore a fraction \(\Delta T/T\) of a turn:</p>
      <div class="eqs"><span>$$\varphi = -360^\circ\,\frac{\Delta T}{T} = -360^\circ \cdot f \cdot \Delta T$$</span></div>
      <p>with \(\Delta T\) in seconds (the table takes it in µs). Example: \(f = 1\ \text{kHz}\), \(V_{\text{in,pp}} = 4\ \text{V}\), \(V_{\text{out,pp}} = 3.39\ \text{V}\), \(\Delta T = 89.2\ \mu\text{s}\) give \(G = 0.848\), \(G_{\text{dB}} = -1.4\ \text{dB}\) and \(\varphi = -360 \times 1000 \times 89.2\cdot 10^{-6} = -32.1^\circ\).</p>`,
    es:String.raw`<h4>Fórmulas</h4>
      <p><b>Ganancia</b>: cociente de las amplitudes pico a pico, luego en decibeles:</p>
      <div class="eqs"><span>$$G = \frac{V_{\text{out,pp}}}{V_{\text{in,pp}}}$$</span><span>$$G_{\text{dB}} = 20\,\log_{10} G$$</span></div>
      <p><b>Fase</b>: un período \(T = 1/f\) corresponde a 360°. Un retardo \(\Delta T\) de la salida es entonces una fracción \(\Delta T/T\) de vuelta:</p>
      <div class="eqs"><span>$$\varphi = -360^\circ\,\frac{\Delta T}{T} = -360^\circ \cdot f \cdot \Delta T$$</span></div>
      <p>con \(\Delta T\) en segundos (la tabla lo recibe en µs). Ejemplo: \(f = 1\ \text{kHz}\), \(V_{\text{in,pp}} = 4\ \text{V}\), \(V_{\text{out,pp}} = 3{,}39\ \text{V}\), \(\Delta T = 89{,}2\ \mu\text{s}\) dan \(G = 0{,}848\), \(G_{\text{dB}} = -1{,}4\ \text{dB}\) y \(\varphi = -360 \times 1000 \times 89{,}2\cdot 10^{-6} = -32{,}1^\circ\).</p>`
  };
  // TeX → HTML (KaTeX); without KaTeX the TeX source stays readable
  function texToHtml(src){
    const k = window.katex;
    const one = (tex, display) => {
      if(!k || typeof k.renderToString !== 'function') return display ? tex : tex;
      try{ return k.renderToString(tex, {displayMode:display, throwOnError:false, output:'html'}); }catch(_){ return tex; }
    };
    return src.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => one(t, true)).replace(/\\\(([\s\S]+?)\\\)/g, (_, t) => one(t, false));
  }
  function renderFormulas(){ $('#formulas').innerHTML = texToHtml(FORMULAS[LANG] || FORMULAS.fr); }
  // KaTeX is loaded with defer: render again once it is there
  // (setLang renders them at start; a deferred script has normally run by then, this is the fallback)
  (function whenKatex(){
    if(window.katex) return;
    const sc = document.querySelector('script[src*="katex"]');
    if(sc) sc.addEventListener('load', () => renderFormulas(), {once:true});
  })();

  // ========= State: per circuit, its component values and one table per measured component =========
  // components across which V_out can be measured (L = the real coil, its resistance R_L included)
  const OUTS = {rc:['C', 'R'], rlc:['C', 'R', 'L']};
  // expected phase range of each set-up (continuous theoretical phase); measured φ is brought within ±180° of its centre
  const PHASE_RANGE = {rc:{C:[-90, 0], R:[0, 90]}, rlc:{C:[-180, 0], R:[-90, 90], L:[0, 180]}};
  const blankRow = () => ({f:'', ve:'', vs:'', dt:''});
  const blankRows = () => Array.from({length:DEFAULT_ROWS}, blankRow);
  const defaultCircuit = kind => ({
    ...(kind === 'rc' ? {R:'1000', C:'100'} : {R:'1000', C:'100', L:'10', RL:'0'}),

  const defaultState = () => ({circuit:'rc', rc:defaultCircuit('rc'), rlc:defaultCircuit('rlc'), names:'', group:'', fitBode:true});
  let state = defaultState();
  const cur = () => state[state.circuit];

  let theoryOn = false;          // never persisted: always off after a reload
  let LANG = 'fr';

  // ========= Number parsing / formatting =========
  // accepts "3,39" and "3.39", spaces allowed, nothing else
  function parseNum(s){
    if(s == null) return NaN;
    s = String(s).trim().replace(/[\s  ]+/g, '').replace(',', '.');
    if(!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return NaN;

  const round1 = v => { const r = Math.round(v*10)/10; return r === 0 ? 0 : r; };   // no "-0.0"
  const fmtG   = v => fmt(v, {minimumSignificantDigits:3, maximumSignificantDigits:3}, 'g');
  const fmtDec1 = v => fmt(Number.isFinite(v) ? round1(v) : v, {minimumFractionDigits:1, maximumFractionDigits:1}, 'd1');

  // CSV: fixed number of decimals, decimal comma in French
  function csvNum(v, dec){
    if(!Number.isFinite(v)) return '';

    return LANG === 'fr' ? s.replace('.', ',') : s;
  }

  // ========= Row computation =========
  function computeRow(row, kind = state.circuit, out = state[kind].out){
    const f = parseNum(row.f), ve = parseNum(row.ve), vs = parseNum(row.vs), dt = parseNum(row.dt);
    const res = {f, ve, vs, dt, G:NaN, GdB:NaN, phi:NaN};
    const fOk = Number.isFinite(f) && f > 0;
    if(fOk && Number.isFinite(ve) && ve > 0 && Number.isFinite(vs) && vs >= 0){
      res.G = vs / ve;
      if(res.G > 0) res.GdB = 20 * log10(res.G);
    }
    if(fOk && Number.isFinite(dt)){
      // a phase is defined modulo 360°: take the branch within ±180° of the set-up's expected range,
      // so a leading output works whether ΔT is typed negative or up to the next rising crossing
      const raw = -360 * f * dt * 1e-6, pr = PHASE_RANGE[kind][out], ctr = (pr[0] + pr[1]) / 2;
      res.phi = raw - 360 * Math.ceil((raw - ctr - 180) / 360);

  // is a non-empty cell value invalid? (empty cells are simply "not yet measured")
  function cellInvalid(key, raw){
    if(String(raw).trim() === '') return false;

    if(!Number.isFinite(v)) return true;

    if(key === 'vs') return v < 0;
    return false;
  }
  const COLS = ['f', 've', 'vs', 'dt'];
  const rowHasData = r => COLS.some(k => String(r[k]).trim() !== '');
  // measurements of one set-up, or of all the set-ups of a circuit when out is omitted
  const dataCount = (kind, out) => out
    ? rowsOf(kind, out).filter(rowHasData).length
    : OUTS[kind].reduce((n, o) => n + dataCount(kind, o), 0);
  // set-ups (circuit + measured component) that go into the report / CSV: those with data, else the current one
  function configsWithData(){
    const list = [];
    KINDS.forEach(kind => OUTS[kind].forEach(out => { if(dataCount(kind, out) > 0) list.push({kind, out}); }));

  // ========= Components / theory =========
  function components(kind = state.circuit){
    const s = state[kind], rc = kind === 'rc';
    const R = parseNum(s.R), C = parseNum(s.C) * 1e-9, L = parseNum(s.L) * 1e-3, RL = parseNum(s.RL);
    const ok = Number.isFinite(R) && R >= 0 && Number.isFinite(C) && C > 0 &&

  // H(jω) = V_out / V_in of the set-up: {mag, ph in degrees}, phase continuous (no wrapping).
  // RC:  across C 1/(1+jωRC), across R jωRC/(1+jωRC).
  // RLC: D = 1 − ω²LC + jω(R+R_L)C; across C 1/D, across R jωRC/D, across the coil jωC(R_L + jωL)/D.
  function theoryAt(f, c, out = 'C'){
    const w = TWO_PI * f, DEG = 180 / Math.PI;
    if(c.rc){
      const x = w * c.R * c.C, mag = 1 / Math.sqrt(1 + x*x), ph = -Math.atan(x) * DEG;
      return out === 'R' ? {mag: x * mag, ph: 90 + ph} : {mag, ph};
    }
    const re = 1 - w*w*c.L*c.C, im = w * (c.R + c.RL) * c.C;
    const d = Math.hypot(re, im), den = Math.atan2(im, re) * DEG;
    if(!(d > 0)) return {mag: Infinity, ph: out === 'C' ? -90 : out === 'R' ? 0 : 90};
    if(out === 'R') return {mag: w * c.R * c.C / d, ph: 90 - den};
    if(out === 'L') return {mag: w * c.C * Math.hypot(c.RL, w * c.L) / d, ph: 90 + Math.atan2(w * c.L, c.RL) * DEG - den};
    return {mag: 1 / d, ph: -den};

    return {f0, Q: Rt > 0 ? Math.sqrt(c.L / c.C) / Rt : Infinity};
  }
  function componentsText(kind){

    if(kind === 'rlc') txt += `, L = ${esc(s.L)} mH, R<sub>L</sub> = ${esc(s.RL)} Ω`;
    return txt;
  }

  // ========= Persistence (inside try/catch: the app keeps working without storage) =========

  // ========= Schematics (SVG) =========
  function resistorPath(x, y, len, n = 6, a = 7){
    // horizontal zigzag centred on y, from x to x+len, n peaks
    const dx = len / (2*n);
    let d = `M${x} ${y}`;
    for(let i = 0; i < 2*n; i++){
      const xx = x + dx*(i + 0.5), yy = (i % 2 === 0) ? y - a : y + a;
      d += ` L${xx.toFixed(1)} ${yy}`;
    }
    return d + ` L${x+len} ${y}`;
  }
  function inductorPath(x, y, len){
    const n = 4, r = len / (2*n);
    let d = `M${x} ${y}`;
    for(let i = 0; i < n; i++) d += ` a${r} ${r} 0 0 1 ${2*r} 0`;
    return d;
  }
  // series parts on the top rail, and the measured branch (to ground, across the output terminals)
  const SERIES = {rc:{C:['R'], R:['C']}, rlc:{C:['R', 'L', 'RL'], R:['L', 'RL', 'C'], L:['R', 'C']}};
  const BRANCH = {rc:{C:['C'], R:['R']}, rlc:{C:['C'], R:['R'], L:['L', 'RL']}};
  // one part drawn from (0,0) along +x; rotated by 90° for the vertical branch
  function partPath(p, len){
    if(p === 'R') return `<path d="${resistorPath(0, 0, len)}"/>`;
    if(p === 'RL') return `<path d="${resistorPath(0, 0, len, 3, 4.5)}"/>`;
    if(p === 'L') return `<path d="${inductorPath(0, 0, len)}"/>`;
    const a = len/2 - 6, b = len/2 + 6;   // capacitor
    return `<path d="M0 0 H${a}"/><path d="M${a} -14 V14"/><path d="M${b} -14 V14"/><path d="M${b} 0 H${len}"/>`;
  }
  const partLabel = (p, x, y, anchor) => p === 'RL'
    ? `<text x="${x}" y="${y}" text-anchor="${anchor}" style="font-size:11px">R<tspan class="sub" dy="3" style="font-size:8px">L</tspan></text>`
    : `<text x="${x}" y="${y}" text-anchor="${anchor}">${p}</text>`;
  // widest drawing of each circuit, so that switching the measured component keeps the scale
  const SCHEM_REF_W = {rc:266, rlc:362};
  function schematicSVG(kind, out){
    const yTop = 34, yBot = 124, xIn = 92;
    const hLen = {R: kind === 'rc' ? 60 : 52, L:56, RL:24, C:28}, vLen = {R:50, L:44, RL:22, C:28};
    let body = '', x = xIn + 16;
    body += `<path d="M${xIn} ${yTop} H${x}"/>`;
    SERIES[kind][out].forEach((p, i) => {
      if(i){ body += `<path d="M${x} ${yTop} H${x+12}"/>`; x += 12; }
      body += `<g transform="translate(${x} ${yTop})">${partPath(p, hLen[p])}</g>` + partLabel(p, x + hLen[p]/2, yTop - (p === 'RL' ? 12 : p === 'C' ? 20 : 14), 'middle');
      x += hLen[p];
    });

    // measured branch, centred between the rails

    let y = yTop + (yBot - yTop - total) / 2;
    body += `<path d="M${xB} ${yTop} V${y}"/>`;
    parts.forEach((p, i) => {
      if(i){ body += `<path d="M${xB} ${y} V${y+6}"/>`; y += 6; }

      y += vLen[p];

    s += `<circle cx="42" cy="79" r="16"/><path d="M32 79 q5 -9 10 0 t10 0"/><path d="M42 63 V${yTop} H${xIn}"/>`;
    s += body;
    // input terminals and v_in
    s += `<circle class="node" cx="${xIn}" cy="${yTop}" r="3"/><circle class="node" cx="${xIn}" cy="${yBot}" r="3"/>`;
    s += `<text class="sign vin" x="${xIn}" y="${yTop+22}" text-anchor="middle">+</text>`;
    s += `<text class="vin" x="${xIn}" y="${(yTop+yBot)/2+5}" text-anchor="middle">v<tspan class="sub" dy="3">in</tspan></text>`;
    s += `<text class="sign vin" x="${xIn}" y="${yBot-10}" text-anchor="middle">−</text>`;
    // output terminals and v_out
    s += `<circle class="node" cx="${xOut}" cy="${yTop}" r="3"/><circle class="node" cx="${xOut}" cy="${yBot}" r="3"/>`;
    s += `<text class="sign vout" x="${xOut}" y="${yTop+22}" text-anchor="middle">+</text>`;
    s += `<text class="vout" x="${xOut}" y="${(yTop+yBot)/2+5}" text-anchor="middle">v<tspan class="sub" dy="3">out</tspan></text>`;
    s += `<text class="sign vout" x="${xOut}" y="${yBot-10}" text-anchor="middle">−</text>`;
    return s + '</svg>';
  }
  function dtDrawingSVG(){
    const W = 240, H = 100, y0 = 48, T = 150, x0 = 18, delay = 36, aIn = 30, aOut = 19;

  // ========= Language =========
  const langBtns = [$('#lang-fr'), $('#lang-en'), $('#lang-es')];

  langBtns.forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

  function renderDate(){

  // ========= Theme =========
  (function themeToggle(){

  // ========= Circuit panel =========
  const circuitSel = $('#circuitSel'), outSel = $('#outSel');
  // both selectors show how many measurements each circuit / measured component already holds

  // ========= Hidden theory checkbox =========
  // Showing the curve is hidden: Ctrl+Shift+click (Cmd+Shift+click also on a Mac), or a 5 s long press
  // on a touch screen. Hiding it again is a plain click or tap.
  // mousedown, not click: on a Mac, Ctrl+click is a right click and never fires "click".
  const theoryCheck = $('#theoryCheck'), theoryRow = $('#theoryRow');
  const theoryKeys = e => (e.ctrlKey || e.metaKey) && e.shiftKey;

  theoryRow.addEventListener('contextmenu', e => { if(theoryKeys(e)) e.preventDefault(); });
  theoryRow.addEventListener('mousedown', e => {
    if(Date.now() - lastTouch < 1000) return;
    if(theoryKeys(e) && (e.button === 0 || (e.button === 2 && e.ctrlKey))){ e.preventDefault(); toggleTheory(); return; }
    if(theoryOn && e.button === 0){ e.preventDefault(); toggleTheory(); }   // off: a plain click is enough

  });
  // touch: curve hidden → a 5 s long press shows it, with no visual hint; curve shown → a tap hides it.
  // Moving the finger, lifting it early or a scroll taking over the touch cancels either gesture.
  (function theoryTouch(){
    const HOLD_MS = 5000, SLOP = 10;
    let timer = 0, start = null;
    const cancel = () => { clearTimeout(timer); timer = 0; start = null; };
    theoryRow.addEventListener('pointerdown', e => {
      if(e.pointerType === 'mouse') return;
      cancel(); lastTouch = Date.now();
      start = {id:e.pointerId, x:e.clientX, y:e.clientY, tap:theoryOn};
      if(!theoryOn) timer = setTimeout(() => { timer = 0; start = null; lastTouch = Date.now(); toggleTheory(); }, HOLD_MS);
    });
    theoryRow.addEventListener('pointermove', e => {
      if(start && e.pointerId === start.id && Math.hypot(e.clientX - start.x, e.clientY - start.y) > SLOP) cancel();
    });
    theoryRow.addEventListener('pointerup', e => {
      if(e.pointerType === 'mouse') return;
      lastTouch = Date.now();

  // ========= CSV export: one block per circuit with data =========
  function csvEscape(s){

  }
  // rows with at least one filled cell, sorted by frequency (unparsable frequencies last)
  function sortedRows(kind, out){
    return rowsOf(kind, out)
      .filter(rowHasData)
      .map(row => ({row, c: computeRow(row, kind, out)}))
      .sort((a, b) => (Number.isFinite(a.c.f) ? a.c.f : Infinity) - (Number.isFinite(b.c.f) ? b.c.f : Infinity));
  }
  function buildCSV(){
    const t = TXT[LANG], lines = [];

    lines.push([t.names, state.names].map(csvEscape).join(';'));
    lines.push([t.group, state.group].map(csvEscape).join(';'));
    configsWithData().forEach(({kind, out}) => {
      const s = state[kind], c = components(kind);
      lines.push('');
      lines.push([t.reportCircuit, t[kind]].map(csvEscape).join(';'));
      lines.push([t.csvOut, t.outOpt[out]].map(csvEscape).join(';'));
      lines.push(['R (Ω)', csvNum(c.R)].join(';'));
      lines.push(['C (nF)', csvNum(parseNum(s.C))].join(';'));

      lines.push(['f (Hz)', 'V_in,pp (V)', 'V_out,pp (V)', 'ΔT (µs)', 'G (V/V)', 'G_dB (dB)', 'φ (°)'].join(';'));

        lines.push([raw('f', c.f), raw('ve', c.ve), raw('vs', c.vs), raw('dt', c.dt),
                    Number.isFinite(c.G) ? csvNum(Number(c.G.toPrecision(3))) : '', csvNum(c.GdB, 1), csvNum(c.phi, 1)].join(';'));

  // ========= Bode plots =========

            meas:cssVar('--c-meas'), theory:cssVar('--c-theory'), mark:cssVar('--c-mark')};

  const FONT = 'ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
  // doubleClick false: Plotly's own reset would autoscale to the points after ours (see fitAllPlots)
  function plotConfig(){ return {displaylogo:false, displayModeBar:false, responsive:true, showTips:false, scrollZoom:false, doubleClick:false}; }

  // measured points of a circuit, sorted by frequency
  function measuredPoints(kind, out){
    const pts = rowsOf(kind, out).map(r => computeRow(r, kind, out)).filter(c => Number.isFinite(c.f) && c.f > 0);
    pts.sort((a, b) => a.f - b.f);

  // log-frequency range: 10 Hz – 100 kHz by default, extended by whole decades to fit the points
  function freqRangeExp(pts){
    let lo = log10(BODE_FMIN), hi = log10(BODE_FMAX);

    return [lo, hi];
  }
  function theoryCurve(range, c, out){
    const n = 400, f = [], mag = [], ph = [];
    for(let i = 0; i <= n; i++){
      const ff = Math.pow(10, range[0] + (range[1]-range[0]) * i / n);
      const h = theoryAt(ff, c, out);
      f.push(ff); mag.push(Number.isFinite(h.mag) && h.mag > 0 ? 20*log10(h.mag) : null); ph.push(h.ph);
    }
    return {f, mag, ph};
  }
  function hoverText(c){
    return `f = ${fmtF(c.f)} Hz<br>G = ${fmtG(c.G)} (${fmtDec1(c.GdB)} dB)<br>φ = ${Number.isFinite(c.phi) ? fmtDec1(c.phi) + '°' : '—'}`;
  }
  function hoverTextPhase(c){
    return `f = ${fmtF(c.f)} Hz<br>G = ${Number.isFinite(c.GdB) ? fmtG(c.G) + ' (' + fmtDec1(c.GdB) + ' dB)' : '—'}<br>φ = ${fmtDec1(c.phi)}°`;

  const withAlpha = (hex, a) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());

  // corner of the plotting area (about a third of its width, a third of its height) with the least drawn in it;
  // a measured point weighs as much as 8 samples of the theory curve. Ties: top left, top right, bottom left.
  function emptiestCorner(xRangeLog, yRange, series){
    const corners = [{left:true, top:true}, {left:false, top:true}, {left:true, top:false}, {left:false, top:false}];
    let best = corners[0], bestScore = Infinity;
    corners.forEach(cn => {
      let score = 0;
      series.forEach(sr => sr.x.forEach((f, i) => {
        const y = sr.y[i];
        if(!(f > 0) || y == null || !Number.isFinite(y)) return;
        const fx = (Math.log10(f) - xRangeLog[0]) / (xRangeLog[1] - xRangeLog[0]);
        const fy = (y - yRange[0]) / (yRange[1] - yRange[0]);
        const inX = cn.left ? fx <= 0.38 : fx >= 0.62, inY = cn.top ? fy >= 0.66 : fy <= 0.34;

  // everything the two plots of a circuit need: data + layouts, for the screen palette or the light print palette
  function buildPlotModel(kind, out, pal, sizeOpts){
    const t = TXT[LANG], pts = measuredPoints(kind, out);
    const allPts = pts.gain.concat(pts.phase);
    const range = freqRangeExp(allPts);
    const c = components(kind);
    const th = (theoryOn && c.ok) ? theoryCurve(range, c, out) : null;
    const ch = th ? characteristic(c) : null;
    const fMark = ch ? (c.rc ? ch.fc : ch.f0) : null;

    const markerStyle = {color:pal.meas, size:9, line:{color:pal.paper, width:1}};
    const magData = [
      {type:'scatter', mode:'markers', name:t.traceMeas, x:pts.gain.map(p => p.f), y:pts.gain.map(p => p.GdB),
       text:pts.gain.map(hoverText), hovertemplate:'%{text}<extra></extra>', marker:markerStyle}
    ];
    const phData = [
      {type:'scatter', mode:'markers', name:t.traceMeas, x:pts.phase.map(p => p.f), y:pts.phase.map(p => p.phi),
       text:pts.phase.map(hoverTextPhase), hovertemplate:'%{text}<extra></extra>', marker:markerStyle}
    ];

      magData.unshift({type:'scatter', mode:'lines', name:t.traceTh, x:th.f, y:th.mag, line:{color:pal.theory, width:2}, hoverinfo:'skip'});
      phData.unshift({type:'scatter', mode:'lines', name:t.traceTh, x:th.f, y:th.ph, line:{color:pal.theory, width:2}, hoverinfo:'skip'});
    }
    // the characteristic frequency (f_c for RC, f_0 for RLC): a red dot on the theory curve, with its legend entry
    let markPt = null;
    if(th && Number.isFinite(fMark) && fMark > 0){
      const h = theoryAt(fMark, c, out), gdb = Number.isFinite(h.mag) && h.mag > 0 ? 20 * log10(h.mag) : null;
      const sym = c.rc ? 'f<sub>c</sub>' : 'f<sub>0</sub>', symTxt = c.rc ? 'f_c' : 'f_0';
      const name = `${sym} = ${fmtChar(fMark)} Hz`;
      const tip = `${symTxt} = ${fmtChar(fMark)} Hz<br>G = ${gdb == null ? '—' : fmtDec1(gdb) + ' dB'}<br>φ = ${fmtDec1(h.ph)}°`;
      const mk = {color:pal.mark, size:10, line:{color:pal.paper, width:1.5}};
      markPt = {f:fMark, gdb, ph:h.ph};
      if(gdb != null) magData.push({type:'scatter', mode:'markers', name, x:[fMark], y:[gdb], marker:mk, text:[tip], hovertemplate:'%{text}<extra></extra>'});
      phData.push({type:'scatter', mode:'markers', name, x:[fMark], y:[h.ph], marker:mk, text:[tip], hovertemplate:'%{text}<extra></extra>'});
    }

    // y ranges: always include the measured points (and the theory when shown)
    const gVals = pts.gain.map(p => p.GdB).concat(th ? th.mag.filter(Number.isFinite) : []);
    let gLo = Math.min(-40, ...gVals), gHi = Math.max(5, ...gVals);
    gLo = Math.floor(gLo/5)*5 - 2; gHi = Math.ceil(gHi/5)*5 + 2;
    const pVals = pts.phase.map(p => p.phi).concat(th ? th.ph : []);
    const pr = PHASE_RANGE[kind][out];
    let pLo = Math.min(pr[0] - 5, ...pVals), pHi = Math.max(pr[1] + 5, ...pVals);
    pLo = Math.floor(pLo/15)*15 - 5; pHi = Math.ceil(pHi/15)*15 + 5;

    const shapes = [];
    const axis = {gridcolor:pal.grid, zerolinecolor:pal.zero, linecolor:pal.zero, tickcolor:pal.zero, automargin:true};
    // the legend lies inside the plot, in the corner that holds the fewest points and the least curve
    const magSeries = [{x:pts.gain.map(p => p.f), y:pts.gain.map(p => p.GdB), w:8}];
    const phSeries = [{x:pts.phase.map(p => p.f), y:pts.phase.map(p => p.phi), w:8}];
    if(th){ magSeries.push({x:th.f, y:th.mag, w:1}); phSeries.push({x:th.f, y:th.ph, w:1}); }

    };

      separators: LANG === 'en' ? '.,' : ',.',

      uirevision: kind + out + '|' + range.join('|') + '|' + yRange.join('|') + '|' + (th ? 'th' : 'no'),
      shapes
    });
    return {
      mag:{data:magData, layout:base(t.bodeTitle, t.bodeYdB, [gLo, gHi], null, legendFor(magSeries, [gLo, gHi]))},
      phase:{data:phData, layout:base(t.bodePhaseTitle, t.phaseY, [pLo, pHi], pr[1] - pr[0] > 90 ? 30 : 15, legendFor(phSeries, [pLo, pHi]))},

  function legendBox(legendEl){

  // The mouse wheel is left alone (it scrolls, never zooms or moves the plot). A two-finger swipe
  // that STARTS horizontally latches into "pan" for the whole gesture and then pans in both
  // directions; a gesture that starts vertically, or a pinch (Ctrl+wheel), keeps the browser's
  // usual behaviour. The latch outlives short pauses (and Windows' lift-and-replace of the fingers
  // needed to change axis), then expires so the wheel scrolls again.
  function setupWheelPan(gd){
    if(!gd || gd.dataset.wheelPan) return;
    gd.dataset.wheelPan = '1';
    const END_MS = 800;
    let base = null, endTimer = 0, raf = 0, pdx = 0, pdy = 0;
    const scale = e => e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? (gd.clientHeight || 800) : 1;
    function flush(){
      raf = 0;
      if(!base) return;
      // scroll right -> higher frequencies, scroll up -> higher values: the view follows the fingers
      const xs = pdx / base.xLen * base.xSpan, ys = -pdy / base.yLen * base.ySpan;
      pdx = 0; pdy = 0;
      base.x = [base.x[0] + xs, base.x[1] + xs];
      base.y = [base.y[0] + ys, base.y[1] + ys];
      Plotly.relayout(gd, {'xaxis.autorange':false, 'xaxis.range':base.x.slice(), 'yaxis.autorange':false, 'yaxis.range':base.y.slice()});
    }
    gd.addEventListener('wheel', e => {
      if(!base){
        if(e.ctrlKey || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;   // mouse wheel, vertical swipe, pinch
        const p = plotAreaPoint(gd, e.clientX, e.clientY);
        if(!p) return;
        const x = p.xa.range.map(Number), y = p.ya.range.map(Number);
        base = {xLen:p.xa._length, yLen:p.ya._length, xSpan:x[1]-x[0], ySpan:y[1]-y[0], x, y};
      }
      clearTimeout(endTimer);
      endTimer = setTimeout(() => { base = null; pdx = 0; pdy = 0; }, END_MS);
      e.preventDefault(); e.stopPropagation();
      pdx += e.deltaX * scale(e); pdy += e.deltaY * scale(e);
      if(!raf) raf = requestAnimationFrame(flush);
    }, {capture:true, passive:false});
  }
  // ----- Fit Bode: both plots share the column height, or fixed heights with a scrolling column -----
  const fitBode = $('#fitBode');
  // same breakpoint as the CSS single-column layout, where the checkbox is hidden and the plots always fit
  const ONE_COLUMN_MQ = window.matchMedia('(max-width:1099px)');
  function applyFit(){
    $('#bodeSection').classList.toggle('fit', state.fitBode || ONE_COLUMN_MQ.matches);
    fitBode.checked = state.fitBode;
    if(plotsBuilt){ Plotly.Plots.resize('bodeMag'); Plotly.Plots.resize('bodePhase'); }
  }
  fitBode.addEventListener('change', () => { state.fitBode = fitBode.checked; save(); applyFit(); });
  ONE_COLUMN_MQ.addEventListener('change', applyFit);
  function whenPlotly(){
    return new Promise(res => {
      if(window.Plotly) return res();
      const s = document.querySelector('script[src*="plotly"]');
      if(s) s.addEventListener('load', res, {once:true});
      const iv = setInterval(() => { if(window.Plotly){ clearInterval(iv); res(); } }, 100);
    });
  }

  // ========= Print report: one page per circuit with data =========
  async function plotImage(model, width, height){
    const div = document.createElement('div');
    div.style.cssText = `position:fixed; left:-10000px; top:0; width:${width}px; height:${height}px`;
    document.body.appendChild(div);
    try{
      await Plotly.newPlot(div, model.data, {...model.layout, width, height, uirevision:undefined}, {staticPlot:true, displayModeBar:false});
      return await Plotly.toImage(div, {format:'png', width, height, scale:3});
    }finally{ Plotly.purge(div); div.remove(); }
  }
  function esc(s){ return String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
  async function buildReport(){
    $('#report').innerHTML = '';
    const t = TXT[LANG];
    const printSize = {margin:{l:50, r:14, t:34, b:44}, titleSize:15, legendSize:11};
    const configs = configsWithData();
    const meta = `<h1>${esc(t.title)}</h1>
      <dl class="meta">
        <dt>${esc(t.names)}</dt><dd>${esc(state.names) || '—'}</dd>
        <dt>${esc(t.date)}</dt><dd>${esc($('#dateVal').textContent)}</dd>
        <dt>${esc(t.group)}</dt><dd>${esc(state.group) || '—'}</dd>
        <dt>${esc(t.reportCircuit)}</dt><dd>${configs.map(({kind, out}) => `${t[kind]} (${out === 'L' ? 'L + R<sub>L</sub>' : out})`).join(', ')}</dd>
      </dl>`;
    let html = '';
    for(const {kind, out} of configs){
      const m = buildPlotModel(kind, out, LIGHT, printSize);
      const [imgMag, imgPh] = await Promise.all([plotImage(m.mag, 500, 360), plotImage(m.phase, 500, 360)]);
      html += `<section class="page">${meta}
        <h2>${esc(t.reportCircuit)} ${t[kind]} — ${t.reportOut} ${esc(t.outOpt[out])}</h2>
        <p class="comps">${componentsText(kind)}</p>
        <div class="body"><div>
        <table><thead><tr><th>f (Hz)</th><th>V<sub>in,pp</sub> (V)</th><th>V<sub>out,pp</sub> (V)</th><th>ΔT (µs)</th><th>G (V/V)</th><th>G<sub>dB</sub> (dB)</th><th>φ (°)</th></tr></thead><tbody>`;
      sortedRows(kind, out).forEach(({row, c}) => {
        const raw = (key, v, f) => Number.isFinite(v) ? f(v) : esc(row[key]);
        html += `<tr><td>${raw('f', c.f, fmtF)}</td><td>${raw('ve', c.ve, fmtF)}</td><td>${raw('vs', c.vs, fmtF)}</td><td>${raw('dt', c.dt, fmtF)}</td>
                 <td class="c">${fmtG(c.G)}</td><td class="c">${fmtDec1(c.GdB)}</td><td class="c">${fmtDec1(c.phi)}</td></tr>`;
      });
      html += `</tbody></table>`;
      html += `<div class="formulas">${texToHtml(FORMULAS[LANG] || FORMULAS.fr)}</div>`;
      if(theoryOn && m.ch) html += `<div class="theory"><strong>${esc(t.reportTheory)}</strong>${theoryValuesHTML(kind, 'ul')}</div>`;
      html += `</div><div class="plots"><img src="${imgMag}" alt=""><img src="${imgPh}" alt=""></div></div>
        <div class="foot"><div class="line">${esc(t.reportFoot)} — © 2025 Franco Ferrucci</div></div></section>`;
    }
    $('#report').innerHTML = html;
  }
  let printing = false;
  $('#printBtn').addEventListener('click', async () => {
    if(printing || !window.Plotly) return;
    printing = true; $('#printBtn').disabled = true;
    try{ await buildReport(); window.print(); }
    catch(err){ console.error('report', err); }
    finally{ printing = false; $('#printBtn').disabled = false; }
  });
  window.addEventListener('afterprint', () => { $('#report').innerHTML = ''; });

  // ========= Init =========
  function syncAll(){
    syncCircuitInputs();
    namesIn.value = state.names; groupIn.value = state.group;
    renderTable();
    renderCircuitOptions();
    renderTheoryValues();
    applyFit();
  }
  load();
  if(migrated) save();
  let savedLang = null;
  try{ savedLang = localStorage.getItem(LANG_KEY); }catch(_){}
  syncAll();
  setLang(TXT[savedLang] ? savedLang : 'fr');
  whenPlotly().then(() => updatePlots());
  // the Bode column changes height with the window: let Plotly follow it
  // the plots follow their column's size: window resize, splitter drag, layout switch
  function resizePlots(){
    if(!plotsBuilt) return;
    if(plotIsNarrow() !== lastNarrow) updatePlots();   // margins and title placement follow the width
    Plotly.Plots.resize('bodeMag'); Plotly.Plots.resize('bodePhase');
  }
  let resizeRaf = 0;
  const queueResize = () => { if(!resizeRaf) resizeRaf = requestAnimationFrame(() => { resizeRaf = 0; resizePlots(); }); };
  window.addEventListener('resize', () => { applyLeftWidth(); queueResize(); });
  if(window.ResizeObserver) new ResizeObserver(queueResize).observe($('#bodeSection'));

  // ========= Side panel width and splitter =========
  // Automatic width: the whole measurement table fits, when the window leaves the plots at least
  // MIN_RIGHT px; otherwise the table scrolls sideways. A width dragged by the reader is kept (storage).
  const LEFT_W_KEY = 'bode-measure-left-width', MIN_LEFT = 380, MIN_RIGHT = 420;
  let userLeftW = null;
  try{ const v = Number(localStorage.getItem(LEFT_W_KEY)); if(v > 0) userLeftW = v; }catch(_){}
  const appEl = $('#app'), leftEl = $('.left'), splitter = $('#splitter'), tableWrap = $('.table-wrap'), measTable = $('#measTable');
  function autoLeftWidth(){
    // the table's own minimum width (min-content: every column at its content, the same whatever the
    // panel's current width; an 'auto' table would grow into the room it has), a little air, and the
    // panel around the table. The same value at load and after a double-click on the splitter.
    const prev = measTable.style.width;
    measTable.style.width = 'min-content';
    const need = measTable.getBoundingClientRect().width;
    measTable.style.width = prev;
    return Math.ceil(leftEl.getBoundingClientRect().width - tableWrap.clientWidth + need + 24);
  }
  function maxLeft(){ return window.innerWidth - 20 - 12 - MIN_RIGHT; }
  function applyLeftWidth(){
    if(ONE_COLUMN_MQ.matches){ appEl.style.removeProperty('--left-w'); syncHbar(); return; }
    const w = userLeftW != null ? userLeftW : Math.max(560, autoLeftWidth());
    appEl.style.setProperty('--left-w', Math.round(clampW(w)) + 'px');
    syncHbar();
  }
  const clampW = w => Math.max(MIN_LEFT, Math.min(maxLeft(), w));
  function setUserLeftW(w, persist){
    userLeftW = w == null ? null : clampW(w);
    applyLeftWidth(); queueResize();
    if(persist) try{ if(userLeftW == null) localStorage.removeItem(LEFT_W_KEY); else localStorage.setItem(LEFT_W_KEY, String(Math.round(userLeftW))); }catch(_){}
  }
  (function splitterDrag(){
    let drag = null;
    splitter.addEventListener('pointerdown', e => {
      if(e.button !== 0) return;
      e.preventDefault();
      drag = {id:e.pointerId, x0:e.clientX, w0:leftEl.getBoundingClientRect().width};
      try{ splitter.setPointerCapture(e.pointerId); }catch(_){}
      splitter.classList.add('dragging'); document.body.classList.add('splitting');
    });
    splitter.addEventListener('pointermove', e => {
      if(!drag || e.pointerId !== drag.id) return;
      setUserLeftW(drag.w0 + e.clientX - drag.x0, false);
    });
    const end = e => {
      if(!drag || e.pointerId !== drag.id) return;
      drag = null;
      splitter.classList.remove('dragging'); document.body.classList.remove('splitting');
      setUserLeftW(userLeftW, true);
    };
    splitter.addEventListener('pointerup', end);
    splitter.addEventListener('pointercancel', end);
    splitter.addEventListener('dblclick', () => setUserLeftW(null, true));   // back to the automatic width
    splitter.addEventListener('keydown', e => {
      const step = e.shiftKey ? 64 : 16, w = leftEl.getBoundingClientRect().width;
      if(e.key === 'ArrowLeft'){ e.preventDefault(); setUserLeftW(w - step, true); }
      else if(e.key === 'ArrowRight'){ e.preventDefault(); setUserLeftW(w + step, true); }
      else if(e.key === 'Home' || e.key === 'Enter'){ e.preventDefault(); setUserLeftW(null, true); }
    });
  })();
  ONE_COLUMN_MQ.addEventListener('change', applyLeftWidth);

  // ========= The table's horizontal scroll bar where the native one fades out =========
  // A styled native bar is always visible on Windows, macOS, Linux and Android; iOS ignores the styling
  // and fades its bar out, which hid the last columns. There (native bar taking no room), this one shows.
  const hbar = $('#tableHbar'), hthumb = hbar.firstElementChild;
  function syncHbar(){
    const over = tableWrap.scrollWidth > tableWrap.clientWidth + 1;
    tableWrap.classList.toggle('has-x-scroll', over);
    const overlay = tableWrap.offsetHeight - tableWrap.clientHeight < 1;
    hbar.hidden = !(over && overlay);
    if(hbar.hidden) return;
    const track = hbar.clientWidth, tw = Math.max(28, track * tableWrap.clientWidth / tableWrap.scrollWidth);
    const max = tableWrap.scrollWidth - tableWrap.clientWidth;
    hthumb.style.width = tw + 'px';
    hthumb.style.transform = `translateX(${max > 0 ? (track - tw) * tableWrap.scrollLeft / max : 0}px)`;
  }
  tableWrap.addEventListener('scroll', syncHbar, {passive:true});
  if(window.ResizeObserver){ const ro = new ResizeObserver(syncHbar); ro.observe(tableWrap); ro.observe(measTable); }
  (function hbarDrag(){
    let drag = null;
    const scrollTo = (clientX, grabX) => {
      const r = hbar.getBoundingClientRect(), tw = hthumb.offsetWidth, max = tableWrap.scrollWidth - tableWrap.clientWidth;
      const pos = Math.max(0, Math.min(r.width - tw, clientX - r.left - grabX));
      tableWrap.scrollLeft = r.width > tw ? pos / (r.width - tw) * max : 0;
    };
    hbar.addEventListener('pointerdown', e => {
      e.preventDefault();
      const t = hthumb.getBoundingClientRect();
      // grabbing the thumb keeps the finger where it took it; the track jumps the thumb under the finger
      const grabX = e.clientX >= t.left && e.clientX <= t.right ? e.clientX - t.left : t.width / 2;
      drag = {id:e.pointerId, grabX};
      try{ hbar.setPointerCapture(e.pointerId); }catch(_){}
      scrollTo(e.clientX, grabX);
    });
    hbar.addEventListener('pointermove', e => { if(drag && e.pointerId === drag.id) scrollTo(e.clientX, drag.grabX); });
    const end = e => { if(drag && e.pointerId === drag.id) drag = null; };
    hbar.addEventListener('pointerup', end); hbar.addEventListener('pointercancel', end);
  })();

  // the side panel's width needs the rendered table, hence after everything above
  applyLeftWidth();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(applyLeftWidth);
});
</script>
</body>
</html>
