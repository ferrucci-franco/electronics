<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Relevé de diagramme de Bode — RC / RLC</title>
<meta name="description" content="Manual Bode-plot measurement sheet for RC and series RLC circuits: type the oscilloscope readings, get gain and phase, the Bode plot and a printable report.">
<script>
  (function(){
    var hour = new Date().getHours();
    var mode = (hour >= 7 && hour < 18) ? 'light' : 'dark';
    document.documentElement.classList.add(mode);
  })();
</script>
<script defer src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --fg:#0f1222; --muted:#5a6275; --card:#eef4ff; --border:#d7e2f4; --link:#0b6cff; --accent:#2f6fde;
    --paper:#ffffff; --plot:#ffffff; --panel:#f6f8fc;
    --grid:#e6ebf3; --zero:#b9c3d6; --axis:#5a6275;
    --scroll-track:#e4ebf7; --scroll-thumb:#a8bbdb; --scroll-thumb-hover:#7f97bf;
    --c-meas:#1f77b4; --c-theory:#ff7f0e; --c-mark:#e0242b; --c-in:#888888;
    --computed:#f1f4fa; --invalid:#d9343f; --danger:#b3261e;
  }
  html.dark{
    --bg:#0b0e15; --fg:#eaf0ff; --muted:#a9b1c6; --card:#151d30; --border:#27324f; --link:#8ab4ff; --accent:#6d9cff;
    --paper:#111624; --plot:#111624; --panel:#0f1524;
    --grid:#1f2940; --zero:#3a4868; --axis:#a9b1c6;
    --scroll-track:#131b2e; --scroll-thumb:#415374; --scroll-thumb-hover:#5b739d;
    --c-meas:#4a9fe0; --c-theory:#ff9a3c; --c-mark:#ff4d55; --c-in:#9aa1ad;
    --computed:#0d1322; --invalid:#ff6b74; --danger:#ff8a80;
  }

  *{box-sizing:border-box}
  html, body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    overflow:hidden; -webkit-text-size-adjust:100%;
  }
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ===== Layout: side panel (title, settings, table) on the left, Bode on the right, full height;
     each column scrolls on its own, so the plot stays in view while the table grows ===== */
  .app{
    display:grid; gap:10px; padding:10px;
    height:100vh; height:100dvh;
    grid-template-columns:minmax(560px, 44%) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    grid-template-areas:"left right";
  }
  .left{grid-area:left; display:flex; flex-direction:column; gap:10px; min-width:0; min-height:0; overflow:auto; overscroll-behavior:contain;
        scrollbar-width:thin; scrollbar-color:var(--scroll-thumb) var(--scroll-track)}
  .left::-webkit-scrollbar, .bodeWrap::-webkit-scrollbar{width:12px}
  .left::-webkit-scrollbar-track, .bodeWrap::-webkit-scrollbar-track{background:var(--scroll-track); border-radius:999px}
  .left::-webkit-scrollbar-thumb, .bodeWrap::-webkit-scrollbar-thumb{background:linear-gradient(180deg, var(--scroll-thumb), var(--scroll-thumb-hover)); border-radius:999px; border:2px solid var(--scroll-track)}
  .right{grid-area:right; min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:6px}

  .panel{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .side-head{display:flex; flex-direction:column; gap:8px; padding:2px 2px 0; flex:none}
  .side-head .title-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px}
  .side-head h1{margin:0; font-size:18px; line-height:1.25; font-weight:700}
  .side-head .fit-row{display:inline-flex; gap:8px; align-items:center; font-size:14px; cursor:pointer; align-self:flex-start}
  .muted{color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:28px}
  label{font-size:15px}

  button, select, input[type=text]{
    border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px
  }
  select{min-width:150px; cursor:pointer}
  button{cursor:pointer}
  button:hover{filter:brightness(0.95)}
  button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button:disabled{cursor:not-allowed; opacity:.5; filter:none}
  input[type=checkbox]{width:18px; height:18px; margin:0; accent-color:var(--accent); cursor:pointer}

  .lang-theme{display:flex;gap:8px;align-items:center}
  .seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
  .side-head .seg button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:6px 11px;font-size:13px;font-weight:600}
  .side-head .seg button + button{border-left:1px solid var(--border)}
  .side-head .seg button.active{background:var(--accent);color:#fff}
  #themeBtn{padding:5px 10px; font-size:16px; line-height:1.2}

  .card{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:8px;flex:none}
  .card h3{margin:0 0 2px;font-size:15px}
  .grow{flex:1}
  .hint{font-size:12px;line-height:1.35}
  .copyright{font-size:12px;line-height:1.35;padding:2px 2px 0;margin-top:auto}
  .btn-accent{background:var(--accent) !important; color:#fff !important; border-color:var(--accent) !important}
  .btn-accent:hover{filter:brightness(1.08)}
  .btn-danger{color:var(--danger) !important}

  /* ----- circuit panel ----- */
  .circuit-grid{display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:start}
  /* labels next to their values; the circuit selector spans both columns, so its right edge
     lines up with the right edge of the value boxes */
  .comp-fields{display:grid; width:240px; grid-template-columns:minmax(0,1fr) 108px; gap:6px 12px; align-items:center}
  .comp-fields .span{grid-column:1 / -1}
  .comp-fields label{white-space:nowrap}
  .comp-fields .circuit-lbl{margin-bottom:-2px}
  .comp-fields select{width:100%; min-width:0}
  .comp-fields input[type=text]{width:100%; text-align:right; font-variant-numeric:tabular-nums}
  .comp-fields input.invalid{border-color:var(--invalid); box-shadow:0 0 0 1px var(--invalid) inset}
  .schematic{width:340px; max-width:100%; color:var(--fg); justify-self:center}
  .schematic svg{width:100%; height:auto; display:block}
  .schematic text{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif; font-size:13px; fill:var(--fg)}
  .schematic .sub{font-size:9px}
  .schematic .sign{font-size:15px; font-weight:700}
  .schematic .vin{fill:var(--c-in)} .schematic .vout{fill:var(--c-meas)}
  .schematic path, .schematic line, .schematic circle, .schematic rect{stroke:var(--fg); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  .schematic circle.node{fill:var(--fg); stroke:none}
  [hidden]{display:none !important}

  /* ----- fake "disabled" checkbox (toggled with Ctrl+Shift+click) ----- */
  .theory-row{cursor:default; user-select:none; -webkit-user-select:none}
  .fake-check{
    display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:4px;
    border:1.5px solid var(--muted); background:var(--computed); color:var(--muted); font-size:13px; line-height:1; opacity:.55;
  }
  .fake-check[aria-checked="true"]::after{content:'✔'}
  .disabled-label{color:var(--muted); opacity:.6}
  .theory-values dl{display:grid; grid-template-columns:auto auto; gap:4px 14px; margin:0; font-size:14px; justify-content:start}
  .theory-values dt{margin:0; color:var(--muted)}
  .theory-values dd{margin:0; font-variant-numeric:tabular-nums; font-weight:600}

  /* ----- measurement table ----- */
  .table-wrap{overflow-x:auto}
  table.meas{border-collapse:separate; border-spacing:0; width:100%; font-size:14px}
  table.meas th, table.meas td{border-bottom:1px solid var(--border); padding:3px 4px; text-align:center; white-space:nowrap}
  table.meas th{font-weight:600; font-size:13px; padding-bottom:6px; cursor:help}
  table.meas th.nohelp{cursor:default}
  table.meas td.editable input{width:100%; min-width:76px; text-align:right; padding:5px 7px; border-radius:8px; background:var(--paper); font-variant-numeric:tabular-nums}
  table.meas td.editable input.invalid{border-color:var(--invalid); box-shadow:0 0 0 1px var(--invalid) inset}
  table.meas td.computed{background:var(--computed); color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; padding:5px 9px; min-width:76px; user-select:none; -webkit-user-select:none}
  table.meas td.computed:empty::after{content:'—'; opacity:.35}
  table.meas th.computed{background:var(--computed); border-radius:6px 6px 0 0}
  table.meas tr:last-child td{border-bottom:0}
  table.meas td.actions{width:34px; padding:0 2px}
  .row-del{border:0; background:transparent; color:var(--muted); font-size:18px; line-height:1; padding:4px 7px; border-radius:8px}
  .row-del:hover{color:var(--danger); background:var(--computed); filter:none}
  .table-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .table-actions .spacer{flex:1}

  .dt-note{display:grid; grid-template-columns:1fr 240px; gap:10px; align-items:center}
  .dt-note svg{width:100%; height:auto; display:block}
  .dt-note .dt-in{stroke:var(--c-in)} .dt-note .dt-out{stroke:var(--c-meas)}
  .dt-note text{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif; font-size:11px; fill:var(--fg)}
  .dt-note .axis{stroke:var(--zero); stroke-width:1}
  .dt-note .dim{stroke:var(--c-mark); stroke-width:1.2}
  .dt-note .guide{stroke:var(--c-mark); stroke-width:1; stroke-dasharray:3 3}

  /* ----- report fields ----- */
  .report-fields{display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center}
  .report-fields input[type=text]{width:100%}
  .report-fields .date{font-variant-numeric:tabular-nums}

  .confirm-box{border:1px solid var(--danger); border-radius:12px; padding:10px 12px; background:var(--computed); display:flex; flex-direction:column; gap:8px}
  .confirm-box .row{justify-content:flex-end}

  /* ----- Bode ----- */
  .plotwrap.panel{background:var(--paper); padding:8px}
  .bodeWrap{display:flex;flex-direction:column;gap:8px;min-height:0; flex:1 1 auto; overflow:auto; overscroll-behavior:contain;
            scrollbar-width:thin; scrollbar-color:var(--scroll-thumb) var(--scroll-track)}
  /* "fit" (default): both plots share the panel height, no scroll */
  .right.fit .bodeWrap{overflow:hidden}
  .right.fit #bodeMag{flex:11 1 0; min-height:0; width:100%}
  .right.fit #bodePhase{flex:9 1 0; min-height:0; width:100%}
  /* unfit: comfortable fixed heights, the Bode column scrolls */
  .right:not(.fit) #bodeMag{flex:none; height:480px; width:100%}
  .right:not(.fit) #bodePhase{flex:none; height:420px; width:100%}
  .plotly-notifier{display:none !important}
  body.panning, body.panning *{cursor:grabbing !important}
  body.panning{user-select:none; -webkit-user-select:none}

  @media (max-width:1099px){
    body{overflow:auto}
    .app{height:auto; min-height:100vh; grid-template-columns:minmax(0,1fr); grid-template-rows:none; grid-template-areas:"left" "right"}
    .left{overflow:visible}
    .right{height:760px}
  }

  /* ===== Print report (A4 portrait, light theme) ===== */
  #report{display:none}
  @media print{
    @page{size:A4 portrait; margin:11mm 12mm}
    :root, html.dark{
      --bg:#ffffff; --fg:#000000; --muted:#444c5c; --card:#ffffff; --border:#9aa4b8; --paper:#ffffff; --computed:#f1f4fa;
    }
    html, body{background:#fff !important; color:#000 !important; overflow:visible !important; height:auto !important}
    .app{display:none !important}
    #report{display:block; font-size:10.5pt; color:#000}
    #report .page{break-after:page; page-break-after:always}
    #report .page:last-child{break-after:auto; page-break-after:auto}
    #report h1{font-size:15pt; margin:0 0 4mm}
    #report h2{font-size:12pt; margin:3mm 0 2mm; padding:1.5mm 2.5mm; background:#eef2f8; border-radius:1.5mm}
    #report .meta{display:grid; grid-template-columns:auto 1fr auto 1fr; gap:1.5mm 4mm; margin:0 0 2mm; font-size:10pt}
    #report .meta dt{color:#444; margin:0} #report .meta dd{margin:0; font-weight:600}
    #report .body{display:grid; grid-template-columns:minmax(0,1fr) 98mm; gap:3mm; align-items:start}
    #report table{border-collapse:collapse; width:100%; font-size:8.5pt; table-layout:auto}
    #report th, #report td{border:0.3pt solid #9aa4b8; padding:0.8mm 1.5mm; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
    #report th{background:#eef2f8; text-align:center; font-weight:600; white-space:normal; line-height:1.15}
    #report td.c{background:#f6f8fb; color:#333}
    #report .plots img{display:block; width:98mm; height:auto}
    #report .plots img + img{margin-top:1mm}
    #report .theory{margin-top:2mm; font-size:9.5pt}
    #report .theory ul{margin:1mm 0 0; padding-left:5mm}
    #report .foot{margin-top:3mm; font-size:8pt; color:#555}
    #report .foot .line{border-top:0.3pt solid #9aa4b8; margin-top:3mm; padding-top:1mm}
  }
</style>
<!-- Contador de visitas (GoatCounter, sin cookies ni datos personales). No cuenta en localhost ni desde file://. -->
<script data-goatcounter="https://ferrucci-franco.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="app" id="app">
    <!-- ===== Left column: title and settings, circuit, report fields, table ===== -->
    <aside class="panel left" style="background:var(--panel)">

      <div class="side-head">
        <div class="title-row">
          <h1 id="title">Relevé de diagramme de Bode — RC / RLC série</h1>
          <div class="lang-theme">
            <div class="seg" role="group" aria-label="Langue">
              <button id="lang-fr" type="button" class="active" data-lang="fr" aria-pressed="true">FR</button>
              <button id="lang-en" type="button" data-lang="en" aria-pressed="false">EN</button>
              <button id="lang-es" type="button" data-lang="es" aria-pressed="false">ES</button>
            </div>
            <button id="themeBtn" type="button" title="Changer de thème" aria-label="Changer de thème">🌗</button>
          </div>
        </div>
        <label class="fit-row"><input id="fitBode" type="checkbox" checked /><span id="fitBodeLbl">Ajuster le Bode à la hauteur</span></label>
      </div>

      <!-- Circuit -->
      <div class="card">
        <h3 id="circuitCardTitle">Circuit</h3>
        <div class="circuit-grid">
          <div class="comp-fields">
            <label for="circuitSel" id="circuitLbl" class="span circuit-lbl">Type de circuit</label>
            <select id="circuitSel" class="span">
              <option value="rc" id="optRc">RC</option>
              <option value="rlc" id="optRlc">RLC série</option>
            </select>
            <label for="compR" id="lblR">R (Ω)</label>
            <input id="compR" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
            <label for="compC" id="lblC">C (nF)</label>
            <input id="compC" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
            <label for="compL" id="lblL" class="rlc-only">L (mH)</label>
            <input id="compL" class="rlc-only" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
            <label for="compRL" id="lblRL" class="rlc-only">R<sub>L</sub> bobine (Ω)</label>
            <input id="compRL" class="rlc-only" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
          </div>
          <div class="schematic" id="schematic" aria-hidden="true"></div>
        </div>
        <div class="muted hint" id="circuitHint"></div>

        <!-- hidden theory curve (Ctrl+Shift+click) -->
        <div class="row theory-row" id="theoryRow" title="">
          <span class="fake-check" id="theoryCheck" role="checkbox" aria-checked="false" aria-disabled="true" tabindex="-1"></span>
          <span id="theoryLabel" class="disabled-label">Afficher la courbe théorique</span>
        </div>
        <div class="theory-values" id="theoryValues" hidden></div>
      </div>

      <!-- Report fields -->
      <div class="card">
        <h3 id="reportCardTitle">Rapport</h3>
        <div class="report-fields">
          <label for="namesIn" id="namesLbl">Noms</label>
          <input id="namesIn" type="text" autocomplete="off" />
          <label for="groupIn" id="groupLbl">Groupe / paillasse</label>
          <input id="groupIn" type="text" autocomplete="off" />
          <span id="dateLbl">Date</span>
          <span class="date" id="dateVal"></span>
        </div>
        <div class="row">
          <button id="printBtn" type="button" class="btn-accent">Imprimer le rapport (PDF)</button>
          <button id="csvBtn" type="button">Exporter CSV</button>
          <span class="spacer grow"></span>
          <button id="newBtn" type="button" class="btn-danger">Nouvelle série de mesures</button>
        </div>
        <div class="muted hint" id="reportHint"></div>
        <div class="confirm-box" id="confirmBox" hidden>
          <div id="confirmText">Effacer toutes les mesures, les valeurs des composants et les noms ?</div>
          <div class="row">
            <button id="confirmNo" type="button">Annuler</button>
            <button id="confirmYes" type="button" class="btn-danger">Oui, tout effacer</button>
          </div>
        </div>
      </div>

      <!-- Measurement table -->
      <div class="card">
        <h3 id="tableCardTitle">Mesures</h3>
        <div class="muted hint" id="measHint"></div>
        <div class="table-wrap">
          <table class="meas" id="measTable">
            <thead>
              <tr>
                <th class="nohelp" id="thF">f (Hz)</th>
                <th id="thVe">V<sub>in,pp</sub> (V)</th>
                <th id="thVs">V<sub>out,pp</sub> (V)</th>
                <th id="thDt">ΔT (µs)</th>
                <th class="computed" id="thG">G (V/V)</th>
                <th class="computed" id="thGdb">G<sub>dB</sub> (dB)</th>
                <th class="computed" id="thPhi">φ (°)</th>
                <th class="nohelp"></th>
              </tr>
            </thead>
            <tbody id="measBody"></tbody>
          </table>
        </div>
        <div class="table-actions">
          <button id="addRowBtn" type="button">+ Ajouter une ligne</button>
          <span class="spacer"></span>
          <span class="muted hint" id="rowsHint"></span>
        </div>
        <div class="dt-note">
          <div class="muted hint" id="dtNote"></div>
          <div id="dtDrawing" aria-hidden="true"></div>
        </div>
      </div>

      <div class="muted copyright">
        © 2025 Franco Ferrucci<br>
        <a href="https://ferrucci-lab.com/" target="_blank" rel="noopener">ferrucci-lab.com</a>
      </div>
    </aside>

    <!-- ===== Right column: Bode plot ===== -->
    <section class="panel plotwrap right fit" id="bodeSection">
      <div class="bodeWrap">
        <div id="bodeMag"></div>
        <div id="bodePhase"></div>
      </div>
    </section>
  </div>

  <!-- ===== Printable report (filled just before printing) ===== -->
  <div id="report" aria-hidden="true"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';

  // ========= Helpers =========
  const $ = s => document.querySelector(s);
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const log10 = x => Math.log(x) / Math.LN10;
  const TWO_PI = 2 * Math.PI;
  const STORE_KEY = 'bode-measure-v2';
  const STORE_KEY_V1 = 'bode-measure-v1';
  const LANG_KEY = 'bode-measure-lang';
  const LOCALES = {fr:'fr-FR', en:'en-US', es:'es-ES'};
  const DEFAULT_ROWS = 8;
  const BODE_FMIN = 10, BODE_FMAX = 1e5;
  const KINDS = ['rc', 'rlc'];

  // ========= Texts =========
  const TXT = {
    fr:{
      title:'Relevé de diagramme de Bode — RC / RLC série',
      circuitCard:'Circuit', circuitType:'Type de circuit', rc:'RC', rlc:'RLC série',
      R:'R (Ω)', C:'C (nF)', L:'L (mH)', RL:'R<sub>L</sub> bobine (Ω)',
      circuitHint:'Changer de circuit n’efface rien : chaque circuit garde ses propres valeurs de composants et son propre tableau de mesures.',
      nMeas:n => n === 1 ? '1 mesure' : n + ' mesures',
      measHint:'Mesurez V<sub>in</sub> aux bornes d’entrée du circuit (voie 1), pas sur l’affichage du générateur.',
      dtNote:'ΔT = temps entre le passage montant de l’entrée et le passage montant suivant de la sortie (la sortie est en retard : ΔT &gt; 0, φ &lt; 0).',
      dtTip:'ΔT = temps entre le passage montant de l’entrée et le passage montant suivant de la sortie (la sortie est en retard : ΔT > 0, φ < 0).',
      veTip:'Tension d’entrée crête à crête (voie 1), mesurée aux bornes du circuit.',
      vsTip:'Tension de sortie crête à crête (voie 2), aux bornes de C.',
      gTip:'G = V_out,pp / V_in,pp', gdbTip:'G_dB = 20·log10(G)', phiTip:'φ = −360 · f · ΔT  (ΔT en secondes)',
      tableCard:'Mesures', addRow:'+ Ajouter une ligne', delRow:'Supprimer cette ligne',
      rowsHint:'Virgule ou point décimal acceptés. L’ordre des lignes est libre : le tracé les classe par fréquence.',
      reportCard:'Rapport', names:'Noms', group:'Groupe / paillasse', date:'Date',
      print:'Imprimer le rapport (PDF)', csv:'Exporter CSV', newSeries:'Nouvelle série de mesures',
      reportHint:'Le rapport et le CSV contiennent chaque circuit qui a des mesures (RC, RLC ou les deux, une page par circuit).',
      confirmText:'Effacer toutes les mesures (RC et RLC), les valeurs des composants et les noms ?', confirmYes:'Oui, tout effacer', confirmNo:'Annuler',
      theory:'Afficher la courbe théorique', theoryTitle:'Valeurs caractéristiques (théorie)',

  // ========= State: one measurement set (components + table) per circuit =========

  let state = defaultState();
  const cur = () => state[state.circuit];
  let theoryOn = false;          // never persisted: always off after a reload
  let LANG = 'fr';

  // ========= Number parsing / formatting =========
  // accepts "3,39" and "3.39", spaces allowed, nothing else
  function parseNum(s){
    if(s == null) return NaN;
    s = String(s).trim().replace(/[\s  ]+/g, '').replace(',', '.');
    if(!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return NaN;
    return parseFloat(s);

  const numFmts = {};

  }
  const round1 = v => { const r = Math.round(v*10)/10; return r === 0 ? 0 : r; };   // no "-0.0"
  const fmtG   = v => fmt(v, {minimumSignificantDigits:3, maximumSignificantDigits:3}, 'g');
  const fmtDec1 = v => fmt(Number.isFinite(v) ? round1(v) : v, {minimumFractionDigits:1, maximumFractionDigits:1}, 'd1');
  const fmtF   = v => fmt(v, {maximumFractionDigits:2}, 'f');
  const fmtChar = v => fmt(v, {maximumSignificantDigits:5}, 'c');
  // CSV: fixed number of decimals, decimal comma in French
  function csvNum(v, dec){
    if(!Number.isFinite(v)) return '';

  }

  // ========= Row computation =========
  function computeRow(row){

    const fOk = Number.isFinite(f) && f > 0;
    if(fOk && Number.isFinite(ve) && ve > 0 && Number.isFinite(vs) && vs >= 0){
      out.G = vs / ve;
      if(out.G > 0) out.GdB = 20 * log10(out.G);

    if(fOk && Number.isFinite(dt)) out.phi = -360 * f * dt * 1e-6;

  }

  function cellInvalid(key, raw){

  // ========= Components / theory =========
  function components(kind = state.circuit){
    const s = state[kind], rc = kind === 'rc';
    const R = parseNum(s.R), C = parseNum(s.C) * 1e-9, L = parseNum(s.L) * 1e-3, RL = parseNum(s.RL);
    const ok = Number.isFinite(R) && R >= 0 && Number.isFinite(C) && C > 0 &&
               (rc || (Number.isFinite(L) && L > 0 && Number.isFinite(RL) && RL >= 0));

  // H(jω) of the circuit: {mag, phaseDeg}, phase continuous (0 → −90° for RC, 0 → −180° for RLC)
  function theoryAt(f, c){
    const w = TWO_PI * f;

      const x = w * c.R * c.C;
      return {mag: 1 / Math.sqrt(1 + x*x), ph: -Math.atan(x) * 180 / Math.PI};
    }
    const re = 1 - w*w*c.L*c.C, im = w * (c.R + c.RL) * c.C;

  }

    return txt;
  }

  }

  // ========= Schematics (SVG) =========
  function resistorPath(x, y, len, n = 6, a = 7){
    // horizontal zigzag centred on y, from x to x+len, n peaks
    const dx = len / (2*n);
    let d = `M${x} ${y}`;
    for(let i = 0; i < 2*n; i++){
      const xx = x + dx*(i + 0.5), yy = (i % 2 === 0) ? y - a : y + a;
      d += ` L${xx.toFixed(1)} ${yy}`;
    }
    return d + ` L${x+len} ${y}`;
  }
  function inductorPath(x, y, len){
    const n = 4, r = len / (2*n);
    let d = `M${x} ${y}`;
    for(let i = 0; i < n; i++) d += ` a${r} ${r} 0 0 1 ${2*r} 0`;
    return d;
  }
  function schematicSVG(rlc){
    const yTop = 34, yBot = 124, xIn = 92, xOut = rlc ? 334 : 300, W = rlc ? 360 : 326;
    const xC = rlc ? 286 : 236;
    let s = `<svg viewBox="0 0 ${W} 150" xmlns="http://www.w3.org/2000/svg">`;
    // generator
    s += `<circle cx="42" cy="79" r="16"/><path d="M32 79 q5 -9 10 0 t10 0"/>`;
    s += `<path d="M42 63 V${yTop} H${xIn}"/><path d="M42 95 V${yBot} H${xOut}"/>`;
    // input terminals and v_in
    s += `<circle class="node" cx="${xIn}" cy="${yTop}" r="3"/><circle class="node" cx="${xIn}" cy="${yBot}" r="3"/>`;
    s += `<text class="sign vin" x="${xIn}" y="${yTop+22}" text-anchor="middle">+</text>`;
    s += `<text class="vin" x="${xIn}" y="${(yTop+yBot)/2+5}" text-anchor="middle">v<tspan class="sub" dy="3">in</tspan></text>`;
    s += `<text class="sign vin" x="${xIn}" y="${yBot-10}" text-anchor="middle">−</text>`;
    // top rail with components
    let x = xIn;
    const rLen = rlc ? 48 : 60;
    s += `<path d="M${x} ${yTop} H${x+16}"/>`; x += 16;
    s += `<path d="${resistorPath(x, yTop, rLen)}"/><text x="${x+rLen/2}" y="${yTop-14}" text-anchor="middle">R</text>`; x += rLen;
    if(rlc){
      s += `<path d="M${x} ${yTop} H${x+14}"/>`; x += 14;
      s += `<path d="${inductorPath(x, yTop, 60)}"/><text x="${x+30}" y="${yTop-14}" text-anchor="middle">L</text>`; x += 60;
      s += `<path d="M${x} ${yTop} H${x+10}"/>`; x += 10;
      // the coil's own resistance: a small, short resistor
      s += `<path d="${resistorPath(x, yTop, 24, 3, 4.5)}"/><text x="${x+12}" y="${yTop-12}" text-anchor="middle" style="font-size:11px">R<tspan class="sub" dy="3" style="font-size:8px">L</tspan></text>`; x += 24;
    }
    s += `<path d="M${x} ${yTop} H${xOut}"/>`;
    // capacitor to the bottom rail
    s += `<path d="M${xC} ${yTop} V${(yTop+yBot)/2-6}"/><path d="M${xC-14} ${(yTop+yBot)/2-6} H${xC+14}"/><path d="M${xC-14} ${(yTop+yBot)/2+6} H${xC+14}"/><path d="M${xC} ${(yTop+yBot)/2+6} V${yBot}"/>`;
    s += `<text x="${xC-20}" y="${(yTop+yBot)/2+5}" text-anchor="end">C</text>`;
    // output terminals and v_out
    s += `<circle class="node" cx="${xOut}" cy="${yTop}" r="3"/><circle class="node" cx="${xOut}" cy="${yBot}" r="3"/>`;
    s += `<text class="sign vout" x="${xOut}" y="${yTop+22}" text-anchor="middle">+</text>`;
    s += `<text class="vout" x="${xOut}" y="${(yTop+yBot)/2+5}" text-anchor="middle">v<tspan class="sub" dy="3">out</tspan></text>`;
    s += `<text class="sign vout" x="${xOut}" y="${yBot-10}" text-anchor="middle">−</text>`;
    return s + '</svg>';
  }
  function dtDrawingSVG(){

  // ========= CSV export: one block per circuit with data =========
  function csvEscape(s){
    s = String(s ?? '');

  }
  // rows with at least one filled cell, sorted by frequency (unparsable frequencies last)
  function sortedRows(kind){
    return state[kind].rows
      .filter(rowHasData)
      .map(row => ({row, c: computeRow(row)}))
      .sort((a, b) => (Number.isFinite(a.c.f) ? a.c.f : Infinity) - (Number.isFinite(b.c.f) ? b.c.f : Infinity));
  }
  function buildCSV(){
    const t = TXT[LANG], lines = [];
    lines.push([t.csvComment, new Date().toLocaleDateString(LOCALES[LANG])].map(csvEscape).join(';'));
    lines.push([t.names, state.names].map(csvEscape).join(';'));
    lines.push([t.group, state.group].map(csvEscape).join(';'));
    circuitsWithData().forEach(kind => {
      const s = state[kind], c = components(kind);
      lines.push('');
      lines.push([t.reportCircuit, t[kind]].map(csvEscape).join(';'));
      lines.push(['R (Ω)', csvNum(c.R)].join(';'));
      lines.push(['C (nF)', csvNum(parseNum(s.C))].join(';'));
      if(kind === 'rlc'){ lines.push(['L (mH)', csvNum(parseNum(s.L))].join(';')); lines.push(['R_L (Ω)', csvNum(c.RL)].join(';')); }
      lines.push(['f (Hz)', 'V_in,pp (V)', 'V_out,pp (V)', 'ΔT (µs)', 'G (V/V)', 'G_dB (dB)', 'φ (°)'].join(';'));
      sortedRows(kind).forEach(({row, c}) => {
        const raw = (key, v) => Number.isFinite(v) ? csvNum(v) : csvEscape(row[key]);
        lines.push([raw('f', c.f), raw('ve', c.ve), raw('vs', c.vs), raw('dt', c.dt),
                    Number.isFinite(c.G) ? csvNum(Number(c.G.toPrecision(3))) : '', csvNum(c.GdB, 1), csvNum(c.phi, 1)].join(';'));

  }
  $('#csvBtn').addEventListener('click', () => {

    const a = document.createElement('a');

  // ========= Bode plots =========
  const LIGHT = {paper:'#ffffff', plot:'#ffffff', grid:'#e6ebf3', zero:'#b9c3d6', axis:'#5a6275', fg:'#0f1222', meas:'#1f77b4', theory:'#ff7f0e', mark:'#e0242b'};
  function palette(){
    return {paper:cssVar('--paper'), plot:cssVar('--plot'), grid:cssVar('--grid'), zero:cssVar('--zero'), axis:cssVar('--axis'), fg:cssVar('--fg'),
            meas:cssVar('--c-meas'), theory:cssVar('--c-theory'), mark:cssVar('--c-mark')};
  }
  const FONT = 'ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
  function plotConfig(){ return {displaylogo:false, displayModeBar:false, responsive:true, showTips:false, scrollZoom:false}; }

  // measured points of a circuit, sorted by frequency
  function measuredPoints(kind){
    const pts = state[kind].rows.map(computeRow).filter(c => Number.isFinite(c.f) && c.f > 0);
    pts.sort((a, b) => a.f - b.f);
    return {
      gain: pts.filter(c => Number.isFinite(c.GdB)),
      phase: pts.filter(c => Number.isFinite(c.phi))
    };
  }
  // log-frequency range: 10 Hz – 100 kHz by default, extended by whole decades to fit the points
  function freqRangeExp(pts){
    let lo = log10(BODE_FMIN), hi = log10(BODE_FMAX);
    pts.forEach(c => { lo = Math.min(lo, Math.floor(log10(c.f) + 1e-9)); hi = Math.max(hi, Math.ceil(log10(c.f) - 1e-9)); });
    return [lo, hi];
  }
  function theoryCurve(range, c){
    const n = 400, f = [], mag = [], ph = [];
    for(let i = 0; i <= n; i++){
      const ff = Math.pow(10, range[0] + (range[1]-range[0]) * i / n);
      const h = theoryAt(ff, c);
      f.push(ff); mag.push(Number.isFinite(h.mag) && h.mag > 0 ? 20*log10(h.mag) : null); ph.push(h.ph);
    }
    return {f, mag, ph};
  }
  function hoverText(c){
    return `f = ${fmtF(c.f)} Hz<br>G = ${fmtG(c.G)} (${fmtDec1(c.GdB)} dB)<br>φ = ${Number.isFinite(c.phi) ? fmtDec1(c.phi) + '°' : '—'}`;
  }
  function hoverTextPhase(c){
    return `f = ${fmtF(c.f)} Hz<br>G = ${Number.isFinite(c.GdB) ? fmtG(c.G) + ' (' + fmtDec1(c.GdB) + ' dB)' : '—'}<br>φ = ${fmtDec1(c.phi)}°`;
  }
  // everything the two plots of a circuit need: data + layouts, for the screen palette or the light print palette
  function buildPlotModel(kind, pal, sizeOpts){
    const t = TXT[LANG], pts = measuredPoints(kind);
    const allPts = pts.gain.concat(pts.phase);
    const range = freqRangeExp(allPts);
    const c = components(kind);
    const th = (theoryOn && c.ok) ? theoryCurve(range, c) : null;
    const ch = th ? characteristic(c) : null;
    const fMark = ch ? (c.rc ? ch.fc : ch.f0) : null;

    const markerStyle = {color:pal.meas, size:9, line:{color:pal.paper, width:1}};
    const magData = [
      {type:'scatter', mode:'markers', name:t.traceMeas, x:pts.gain.map(p => p.f), y:pts.gain.map(p => p.GdB),
       text:pts.gain.map(hoverText), hovertemplate:'%{text}<extra></extra>', marker:markerStyle}
    ];
    const phData = [
      {type:'scatter', mode:'markers', name:t.traceMeas, x:pts.phase.map(p => p.f), y:pts.phase.map(p => p.phi),
       text:pts.phase.map(hoverTextPhase), hovertemplate:'%{text}<extra></extra>', marker:markerStyle}
    ];
    if(th){
      magData.unshift({type:'scatter', mode:'lines', name:t.traceTh, x:th.f, y:th.mag, line:{color:pal.theory, width:2}, hoverinfo:'skip'});
      phData.unshift({type:'scatter', mode:'lines', name:t.traceTh, x:th.f, y:th.ph, line:{color:pal.theory, width:2}, hoverinfo:'skip'});
    }

    // y ranges: always include the measured points (and the theory when shown)
    const gVals = pts.gain.map(p => p.GdB).concat(th ? th.mag.filter(Number.isFinite) : []);
    let gLo = Math.min(-40, ...gVals), gHi = Math.max(5, ...gVals);
    gLo = Math.floor(gLo/5)*5 - 2; gHi = Math.ceil(gHi/5)*5 + 2;
    const pVals = pts.phase.map(p => p.phi).concat(th ? th.ph : []);
    let pLo = Math.min(c.rc ? -95 : -185, ...pVals), pHi = Math.max(5, ...pVals);
    pLo = Math.floor(pLo/15)*15 - 5; pHi = Math.ceil(pHi/15)*15 + 5;

    const shapes = fMark ? [{type:'line', x0:fMark, x1:fMark, y0:0, y1:1, xref:'x', yref:'paper', layer:'below',
                             line:{color:pal.mark, width:1.5, dash:'dot'}}] : [];
    const axis = {gridcolor:pal.grid, zerolinecolor:pal.zero, linecolor:pal.zero, tickcolor:pal.zero, automargin:true};
    const base = (title, yTitle, yRange, dtick) => ({
      paper_bgcolor:pal.paper, plot_bgcolor:pal.plot,
      font:{color:pal.axis, family:FONT}, hoverlabel:{font:{family:FONT}},
      margin:sizeOpts.margin, dragmode:'zoom',
      xaxis:{title:{text:t.bodeX}, type:'log', range:range, ...axis, exponentformat:'none', ticks:'outside', minor:{showgrid:true, gridcolor:pal.grid, ticks:'outside'}},
      yaxis:{title:{text:yTitle}, range:yRange, dtick, ...axis},
      showlegend:true, legend:{orientation:'h', x:0.5, xanchor:'center', y:1.01, yanchor:'bottom', bgcolor:'rgba(0,0,0,0)', font:{size:sizeOpts.legendSize}},
      title:{text:'<b>'+title+'</b>', x:0.5, xanchor:'center', y:0.985, yanchor:'top', font:{size:sizeOpts.titleSize, color:pal.fg}},
      separators: LANG === 'en' ? '.,' : ',.',
      // zoom / pan are kept while the data range does not change; a new decade, a new theory or another circuit resets the view
      uirevision: kind + '|' + range.join('|') + '|' + yRange.join('|') + '|' + (th ? 'th' : 'no'),
      shapes
    });
    return {
      mag:{data:magData, layout:base(t.bodeTitle, t.bodeYdB, [gLo, gHi], null)},
      phase:{data:phData, layout:base(t.bodePhaseTitle, t.phaseY, [pLo, pHi], c.rc ? 15 : 30)},
      fMark, ch, c

  }
  const screenSize = () => ({margin:{l:64, r:16, t:76, b:48}, titleSize:18, legendSize:12});

  function updatePlots(){
    if(!window.Plotly) return;
    const m = buildPlotModel(state.circuit, palette(), screenSize());
    const cfg = plotConfig();
    Plotly.react('bodeMag', m.mag.data, m.mag.layout, cfg);
    Plotly.react('bodePhase', m.phase.data, m.phase.layout, cfg);
    if(!plotsBuilt){
      plotsBuilt = true;

    }
  }
  // zooming or panning one plot moves the other (shared log-frequency axis)
  let linking = false;
  function linkXAxes(){
    const mag = document.getElementById('bodeMag'), ph = document.getElementById('bodePhase');
    [[mag, ph], [ph, mag]].forEach(([src, dst]) => {
      src.on('plotly_relayout', ev => {
        if(linking) return;
        const upd = {};
        if('xaxis.range[0]' in ev){ upd['xaxis.range'] = [ev['xaxis.range[0]'], ev['xaxis.range[1]']]; }
        else if(ev['xaxis.autorange'] || ev['xaxis.range']){ upd['xaxis.range'] = src.layout.xaxis.range; }
        else return;
        linking = true;
        Plotly.relayout(dst, upd).then(() => { linking = false; }, () => { linking = false; });

    });
  }
  // pointer position inside the plot area, in pixels from its top-left corner, or null outside it
  function plotAreaPoint(gd, clientX, clientY){
    const fl = gd._fullLayout;
    if(!fl || !fl.xaxis || !fl.yaxis || !fl.xaxis._length) return null;
    const xa = fl.xaxis, ya = fl.yaxis, r = gd.getBoundingClientRect();
    const px = clientX - r.left - xa._offset, py = clientY - r.top - ya._offset;
    if(px < 0 || px > xa._length || py < 0 || py > ya._length) return null;
    return {xa, ya, px, py};
  }
  // ----- Pan with the right (or middle) mouse button -----
  // Plotly would treat a right-button drag as a zoom box it never draws, and on release zoom to
  // a zero-size box. Those buttons never reach Plotly: they pan instead, the left button zooms.
  function setupMousePan(gd){
    if(!gd || gd.dataset.mousePan) return;
    gd.dataset.mousePan = '1';
    let pan = null, raf = 0;
    const isPanButton = e => e.pointerType !== 'touch' && (e.button === 1 || e.button === 2);
    // ranges are linear in pixels (log axis: in decades), so a pan is a plain shift
    function apply(){
      raf = 0;
      if(!pan) return;
      const {x0, y0, kx, ky, dx, dy} = pan;
      Plotly.relayout(gd, {
        'xaxis.autorange': false, 'xaxis.range': [x0[0] - dx*kx, x0[1] - dx*kx],
        'yaxis.autorange': false, 'yaxis.range': [y0[0] + dy*ky, y0[1] + dy*ky]
      });
    }
    gd.addEventListener('pointerdown', e => {
      if(pan || !isPanButton(e)) return;
      const p = plotAreaPoint(gd, e.clientX, e.clientY);
      if(!p) return;
      e.preventDefault(); e.stopPropagation();
      const x0 = p.xa.range.map(Number), y0 = p.ya.range.map(Number);
      pan = {id:e.pointerId, sx:e.clientX, sy:e.clientY, dx:0, dy:0, x0, y0,
             kx:(x0[1]-x0[0])/p.xa._length, ky:(y0[1]-y0[0])/p.ya._length};
      try{ gd.setPointerCapture(e.pointerId); }catch(_){}
      if(Plotly.Fx) Plotly.Fx.unhover(gd);
      document.body.classList.add('panning');
    }, true);
    gd.addEventListener('pointermove', e => {
      if(!pan || e.pointerId !== pan.id) return;
      e.preventDefault(); e.stopPropagation();
      pan.dx = e.clientX - pan.sx; pan.dy = e.clientY - pan.sy;
      if(!raf) raf = requestAnimationFrame(apply);
    }, true);
    const end = e => {
      if(!pan || e.pointerId !== pan.id) return;
      e.stopPropagation();
      if(raf){ cancelAnimationFrame(raf); apply(); }
      pan = null;
      try{ gd.releasePointerCapture(e.pointerId); }catch(_){}
      document.body.classList.remove('panning');
    };
    gd.addEventListener('pointerup', end, true);
    gd.addEventListener('pointercancel', end, true);
    gd.addEventListener('lostpointercapture', end, true);
    // the matching mouse events must not start Plotly's drag either (middle click: no autoscroll)
    ['mousedown','mouseup','auxclick'].forEach(type => gd.addEventListener(type, e => {
      if(e.button === 1 || e.button === 2){ e.stopPropagation(); if(e.cancelable) e.preventDefault(); }
    }, true));
    gd.addEventListener('contextmenu', e => e.preventDefault());
  }
  // ----- Pan with two fingers on a trackpad -----
  // The mouse wheel is left alone (it scrolls, never zooms or moves the plot). A two-finger swipe
  // that STARTS horizontally latches into "pan" for the whole gesture and then pans in both
  // directions; a gesture that starts vertically, or a pinch (Ctrl+wheel), keeps the browser's
  // usual behaviour. The latch outlives short pauses (and Windows' lift-and-replace of the fingers
  // needed to change axis), then expires so the wheel scrolls again.
  function setupWheelPan(gd){
    if(!gd || gd.dataset.wheelPan) return;
    gd.dataset.wheelPan = '1';
    const END_MS = 800;
    let base = null, endTimer = 0, raf = 0, pdx = 0, pdy = 0;
    const scale = e => e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? (gd.clientHeight || 800) : 1;
    function flush(){
      raf = 0;
      if(!base) return;
      // scroll right -> higher frequencies, scroll up -> higher values: the view follows the fingers
      const xs = pdx / base.xLen * base.xSpan, ys = -pdy / base.yLen * base.ySpan;
      pdx = 0; pdy = 0;
      base.x = [base.x[0] + xs, base.x[1] + xs];
      base.y = [base.y[0] + ys, base.y[1] + ys];
      Plotly.relayout(gd, {'xaxis.autorange':false, 'xaxis.range':base.x.slice(), 'yaxis.autorange':false, 'yaxis.range':base.y.slice()});
    }
    gd.addEventListener('wheel', e => {
      if(!base){
        if(e.ctrlKey || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;   // mouse wheel, vertical swipe, pinch
        const p = plotAreaPoint(gd, e.clientX, e.clientY);
        if(!p) return;
        const x = p.xa.range.map(Number), y = p.ya.range.map(Number);
        base = {xLen:p.xa._length, yLen:p.ya._length, xSpan:x[1]-x[0], ySpan:y[1]-y[0], x, y};
      }
      clearTimeout(endTimer);
      endTimer = setTimeout(() => { base = null; pdx = 0; pdy = 0; }, END_MS);
      e.preventDefault(); e.stopPropagation();
      pdx += e.deltaX * scale(e); pdy += e.deltaY * scale(e);
      if(!raf) raf = requestAnimationFrame(flush);
    }, {capture:true, passive:false});
  }
  // ----- Fit Bode: both plots share the column height, or fixed heights with a scrolling column -----
  const fitBode = $('#fitBode');
  function applyFit(){

  }

  function whenPlotly(){
    return new Promise(res => {
      if(window.Plotly) return res();
      const s = document.querySelector('script[src*="plotly"]');
      if(s) s.addEventListener('load', res, {once:true});
      const iv = setInterval(() => { if(window.Plotly){ clearInterval(iv); res(); } }, 100);
    });
  }

  // ========= Print report: one page per circuit with data =========
  async function plotImage(model, width, height){
    const div = document.createElement('div');
    div.style.cssText = `position:fixed; left:-10000px; top:0; width:${width}px; height:${height}px`;
    document.body.appendChild(div);
    try{
      await Plotly.newPlot(div, model.data, {...model.layout, width, height, uirevision:undefined}, {staticPlot:true, displayModeBar:false});
      return await Plotly.toImage(div, {format:'png', width, height, scale:3});
    }finally{ Plotly.purge(div); div.remove(); }
  }
  function esc(s){ return String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
  async function buildReport(){
    $('#report').innerHTML = '';
    const t = TXT[LANG];
    const printSize = {margin:{l:50, r:14, t:54, b:44}, titleSize:15, legendSize:11};
    const kinds = circuitsWithData();
    const meta = `<h1>${esc(t.title)}</h1>
      <dl class="meta">
        <dt>${esc(t.names)}</dt><dd>${esc(state.names) || '—'}</dd>
        <dt>${esc(t.date)}</dt><dd>${esc($('#dateVal').textContent)}</dd>
        <dt>${esc(t.group)}</dt><dd>${esc(state.group) || '—'}</dd>
        <dt>${esc(t.reportCircuit)}</dt><dd>${kinds.map(k => t[k]).join(' + ')}</dd>
      </dl>`;
    let html = '';
    for(const kind of kinds){
      const m = buildPlotModel(kind, LIGHT, printSize);
      const [imgMag, imgPh] = await Promise.all([plotImage(m.mag, 500, 360), plotImage(m.phase, 500, 360)]);
      html += `<section class="page">${meta}
        <h2>${esc(t.reportCircuit)} ${t[kind]} — ${componentsText(kind)}</h2>
        <div class="body"><div>
        <table><thead><tr><th>f (Hz)</th><th>V<sub>in,pp</sub> (V)</th><th>V<sub>out,pp</sub> (V)</th><th>ΔT (µs)</th><th>G (V/V)</th><th>G<sub>dB</sub> (dB)</th><th>φ (°)</th></tr></thead><tbody>`;
      sortedRows(kind).forEach(({row, c}) => {
        const raw = (key, v, f) => Number.isFinite(v) ? f(v) : esc(row[key]);
        html += `<tr><td>${raw('f', c.f, fmtF)}</td><td>${raw('ve', c.ve, fmtF)}</td><td>${raw('vs', c.vs, fmtF)}</td><td>${raw('dt', c.dt, fmtF)}</td>
                 <td class="c">${fmtG(c.G)}</td><td class="c">${fmtDec1(c.GdB)}</td><td class="c">${fmtDec1(c.phi)}</td></tr>`;
      });
      html += `</tbody></table>`;
      if(theoryOn && m.ch) html += `<div class="theory"><strong>${esc(t.reportTheory)}</strong>${theoryValuesHTML(kind, 'ul')}</div>`;
      html += `</div><div class="plots"><img src="${imgMag}" alt=""><img src="${imgPh}" alt=""></div></div>
        <div class="foot"><div class="line">${esc(t.reportFoot)} — © 2025 Franco Ferrucci</div></div></section>`;
    }
    $('#report').innerHTML = html;
  }
  let printing = false;
  $('#printBtn').addEventListener('click', async () => {
    if(printing || !window.Plotly) return;
    printing = true; $('#printBtn').disabled = true;
    try{ await buildReport(); window.print(); }
    catch(err){ console.error('report', err); }
    finally{ printing = false; $('#printBtn').disabled = false; }
  });
  window.addEventListener('afterprint', () => { $('#report').innerHTML = ''; });

  // ========= Init =========
  function syncAll(){
    syncCircuitInputs();
    namesIn.value = state.names; groupIn.value = state.group;
    renderTable();
    renderCircuitOptions();
    renderTheoryValues();
    applyFit();
  }
  load();
  if(migrated) save();
  let savedLang = null;
  try{ savedLang = localStorage.getItem(LANG_KEY); }catch(_){}
  syncAll();
  setLang(TXT[savedLang] ? savedLang : 'fr');
  whenPlotly().then(() => updatePlots());
  // the Bode column changes height with the window: let Plotly follow it
  window.addEventListener('resize', () => { if(plotsBuilt){ Plotly.Plots.resize('bodeMag'); Plotly.Plots.resize('bodePhase'); } });
});
</script>
</body>
</html>
